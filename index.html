<!DOCTYPE html>
<!--
  ============================================================================
  CTS TRAINING REQUEST SYSTEM  —  index.html   (standalone build)
  Merz Aesthetics Thailand · Clinical Training

  ONE self-contained file. No build step, no dependencies, no backend, no CDN
  except Google Fonts (falls back to a system Thai font if blocked).
  Avatars and the Merz logo are embedded as base64.
  Responsive: phone / iPad / laptop. Open the file directly, or drop it on any
  static host (GitHub Pages / Netlify / Vercel / IIS / nginx).

  NOTE: state persists through the Apps Script backend (see Code.gs). Set the
  `API` constant near the bottom of the <script> block to the deployed Web app
  URL. Leave it empty and the app runs in memory only, as before.

  ---------------------------------------------------------------------------
  ROLES
  ---------------------------------------------------------------------------
    Sales          free-slot COUNTS only, never CTS names, until approval.
                   Sees only its OWN requests (identified by member code).
    Sales · UPC    up-country mode: no half-day slots at all — sees only UPC
                   trips, MA central events and holidays. Requests are made as
                   a DATE RANGE with per-day, per-clinic detail.
    CTS            sees every person's schedule (filter: all / my team / person),
                   can add their own work entries.
    Senior Leader  assigns the trainer and approves (PAM = Team A, MILK = Team B,
                   both may approve UPC).
    Admin          all teams, adds MA central events and public holidays.

  ---------------------------------------------------------------------------
  WHERE TO EDIT  (search these names inside the <script> block)
  ---------------------------------------------------------------------------
    FACES          avatar images (base64), keyed by person id
    LOGO_DARK      Merz Aesthetics logo (base64)
    PALETTE        pastel colour per person (fill + ink)
    TEAMS          Team A / Team B / BOTH (UPC) / SUP (supervisor)
    AREA_CFG       sales areas -> owning team + member codes
                   (Champion C01-05, Victory V01-05, Winner W01-05,
                    UPC1-6, KAE1-4 have no sub-codes)
    CTS            the 8 trainers + BELLE (supervisor)
    BOOKABLE_IDS   the 6 people counted as bookable capacity for Sales
                   (PAM, MILK and BELLE are excluded on purpose)
    MODULES        MAX-Entry / MAX-A / MAX-B session rules
    LEVELS         content level (Standard / Advance)
    PRODHEX        product colours   ·  PRODINK  text colour on them
    SLOT_DEF       standard half-day windows (AM 09:00-12:00, PM 13:00-16:30)
    AUTO_RULE      auto-availability rule: 2 h buffer for lunch + travel,
                   3 h next session, day ends 18:00
    HOLIDAYS_SEED  public holidays (Admin can add/remove in-app)
    EXP            experience-level options
    API            Apps Script Web app URL (empty = in-memory only)
    SAVED          which state keys get persisted

  ---------------------------------------------------------------------------
  KEY BEHAVIOURS ALREADY IMPLEMENTED
  ---------------------------------------------------------------------------
    · Availability is DERIVED, never stored twice: any job (from a request, or
      entered by a CTS) instantly changes what Sales can book.
    · AUTO_RULE recalculates the free window when a job overruns
      (AM 10:00-13:00  ->  PM free 15:00-18:00; too little left -> "เวลาไม่พอ").
    · CTS/Admin can override any window manually (🕑) and reset to auto.
    · Requests may be submitted incomplete; missing fields are listed on the
      card, at approval time, and at the bottom of the e-mail text.
    · Everything is editable after submission — including approved requests.
    · Weekends are bookable; only Admin-defined holidays close a day.
    · Multi-person entries render as combined colour stripes.
    · All-day entries pin to the top of the day timeline.

  ---------------------------------------------------------------------------
  TO GO LIVE  (suggested path)
  ---------------------------------------------------------------------------
    1. Backend — DONE. Code.gs stores the whole state as one JSON file on
       Drive; load() reads it, save() writes it from render().
    2. Auth: renderLogin() still trusts whatever role you pick. Add a per-role
       password checked server-side (never keep it in this file).
    3. Calendar write-back: on approve(), create the event in each CTS's
       Google Calendar.
    4. Photos: currently local preview only (URL.createObjectURL) — swap for
       an upload endpoint or a Drive folder.
    5. Notifications: notify() collects them in-app; wire to e-mail or push.

  Generated 23 Aug 2026
  ============================================================================
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1FA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CTS Training">
<title>CTS Training Request — Merz Aesthetics Thailand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2A3D; --ink2:#5B5A73; --ink3:#8E8DA5;
  --paper:#F6F4FB; --surface:#FFFFFF; --line:#E7E3F2; --line2:#F0EDF8;
  --brand:#8B7BD8; --brand-deep:#5F4FB0; --brand-soft:#EFEAFB;
  --ok:#3E9E7A; --ok-soft:#E4F5EE; --ok-edge:#BFE6D5;
  --warn:#C79A2E; --warn-soft:#FDF5E3; --warn-edge:#F0E0B4;
  --bad:#C8697A; --bad-soft:#FCEDF0; --bad-edge:#F2CFD7;
  /* งานกลาง MA / Symposium / Workshop — น้ำเงินเข้มทึบ ให้แยกออกจากสีพาสเทลของคิว CTS */
  --ma:#1E3A73; --ma-soft:#25417C; --ma-edge:#5878B8; --ma-ink:#FFFFFF;
  /* วันหยุด — แดงเข้มขึ้น ให้เห็นชัดออกมาจากคิว CTS */
  --hol-bg:#FAD8DC; --hol-ink:#93202E; --hol-edge:#E39BA4;
  /* availability ramp — pastel green, dark = more free */
  --a0:#ECEAF3; --a1:#E4F5EC; --a2:#C4EBD7; --a3:#9BDCBC; --a4:#6FC9A0; --a5:#44B487;
  --tA:#B9A6F0; --tB:#F5C9A0;
  --r:16px; --r2:20px;
  --sh1:0 1px 2px rgba(43,42,61,.05);
  --sh2:0 2px 6px rgba(43,42,61,.06), 0 12px 28px rgba(43,42,61,.08);
  --sans:'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --navh:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
/* ตารางสัปดาห์เลื่อนแนวนอนในกรอบตัวเองอยู่แล้ว หน้าเว็บทั้งหน้าไม่ต้องเลื่อนซ้าย-ขวาตามไปด้วย
   ถ้าไม่ล็อกไว้ ตอนปัดดูวันถัดไปทั้งหน้าจะไถลตามแล้วดีดกลับ */
body{overflow-x:hidden}
body{background:var(--paper);font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
a{color:var(--brand-deep)}
img{display:block}

/* ============ LOGIN ============ */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px;
  background:linear-gradient(150deg,#EFE9FB 0%,#E9F1FB 34%,#E6F5EF 66%,#FBF0E7 100%)}
.login-card{width:100%;max-width:520px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:30px 26px;box-shadow:var(--sh2)}
.login .logo{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--brand-deep);font-weight:700}
.login h1{font-size:28px;line-height:1.15;margin:10px 0 6px;font-weight:700;letter-spacing:-.025em}
.login p.sub{color:var(--ink3);font-size:13.5px;margin:0 0 24px}
.llabel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;margin:0 0 10px}
.lgroup{margin-bottom:20px}
.rolegrid{display:grid;gap:9px}
@media(min-width:560px){.rolegrid{grid-template-columns:1fr 1fr 1fr}}
.rolebtn{display:flex;align-items:center;gap:11px;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:16px;padding:13px;box-shadow:var(--sh1)}
@media(min-width:560px){.rolebtn{flex-direction:column;align-items:flex-start;gap:8px}}
.rolebtn .ric{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.rolebtn b{display:block;font-size:14.5px}
.rolebtn small{color:var(--ink3);font-size:11.5px;line-height:1.35;display:block}
.rolebtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);
  box-shadow:0 0 0 3px rgba(139,123,216,.16)}
.lsel{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;font-size:14.5px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
input.lsel{background-image:none}   /* ลูกศร dropdown มีไว้ให้ <select> เท่านั้น */
.codegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.codegrid{grid-template-columns:repeat(6,1fr)}}
.codebtn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 4px;font-weight:700;
  font-size:13.5px;box-shadow:var(--sh1);font-family:var(--mono);letter-spacing:.03em}
.codebtn[aria-pressed="true"]{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.who-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.who-card{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:10px 5px;text-align:center;box-shadow:var(--sh1)}
.who-card img{width:44px;height:44px;border-radius:50%;object-fit:cover;margin:0 auto 6px;box-shadow:0 0 0 2.5px var(--c,#eee)}
.who-card b{font-size:11.5px;display:block}
.who-card small{font-size:9.5px;color:var(--ink3);display:block}
.who-card[aria-pressed="true"]{border-color:var(--c);background:var(--c);box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.lgo{width:100%;background:var(--brand-deep);color:#fff;border-radius:15px;padding:14px;font-weight:700;font-size:16px;margin-top:6px}
.lgo:disabled{background:#CFC9E2;cursor:not-allowed}
.lhint{font-size:11.5px;color:var(--ink3);margin-top:14px;text-align:center}
.lcredit{display:block;margin:9px auto 0;background:none;border:0;font-family:inherit;font-size:11.5px;
  font-weight:700;color:var(--brand-deep);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 8px}
.lcredit:hover{opacity:.75}
.devrow{display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid var(--line);
  border-radius:13px;margin-bottom:8px;background:var(--brand-soft)}
.devrow:last-child{margin-bottom:0}
.devname{font-weight:700;font-size:15px;color:var(--ink)}

/* ============ SHELL ============ */
.shell{display:flex;min-height:100dvh}
.side{display:none}
@media(min-width:940px){
  .side{display:flex;flex-direction:column;width:268px;flex:none;background:#fff;border-right:1px solid var(--line);
    padding:20px 16px;position:sticky;top:0;height:100dvh;overflow:auto}
  .main{flex:1;min-width:0;padding:22px 26px 40px}
  .topbar{display:none}
  .botnav{display:none}
}
@media(max-width:939px){
  .main{flex:1;min-width:0;padding:14px 14px calc(var(--navh) + 26px)}
}
.mzlogo{width:190px;max-width:62%;height:auto;margin-bottom:14px}
.mzlogo.sm{width:150px;margin:0 0 8px}
.mzlogo.xs{width:96px;margin:0;flex:none}
.brand{display:block;margin-bottom:20px}
.bsub{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.brand .bm{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#B9A6F0,#7FA8E8);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.brand b{font-size:14.5px;display:block;line-height:1.2}
.brand small{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.navlist{display:flex;flex-direction:column;gap:3px;margin-bottom:20px}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;font-size:14px;font-weight:600;color:var(--ink2)}
.navitem .ic{font-size:16px;width:20px;text-align:center}
.navitem .cnt{margin-left:auto;background:var(--bad);color:#fff;font-family:var(--mono);font-size:10px;
  border-radius:99px;padding:2px 7px;font-weight:700}
.navitem .ic{transition:background .18s,color .18s}
.navitem[aria-selected="true"]{background:var(--tc,var(--brand-soft));color:var(--tci,var(--brand-deep));font-weight:700}
.navitem:not([aria-selected="true"]):hover{background:var(--line2)}
.sidefoot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line2)}
.uchip{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:14px;padding:9px 10px;width:100%;text-align:left}
.uchip img,.uchip .uic{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover}
.uchip .uic{display:grid;place-items:center;font-size:15px;background:var(--brand-soft);color:var(--brand-deep)}
.uchip .nm{font-size:13px;font-weight:700;line-height:1.2}
.uchip .sb{font-size:11px;color:var(--ink3);line-height:1.3}

.topbar{position:sticky;top:0;z-index:40;background:rgba(246,244,251,.92);backdrop-filter:blur(10px);
  padding:10px 14px;margin:-14px -14px 12px;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:10px}
.topbar .bm{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#B9A6F0,#7FA8E8);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.topbar .tt{font-size:14px;font-weight:700;line-height:1.15;flex:1;min-width:0}
.topbar .tt small{display:block;font-size:11px;color:var(--ink3);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;
  place-items:center;font-size:15px;flex:none;box-shadow:var(--sh1)}
/* แถบไอคอนล่าง — แต่ละแท็บมีสีประจำตัว (--tc พื้น · --tci ตัวอักษร) เห็นชัดว่าอยู่หน้าไหน */
.botnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--navh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(70,50,130,.08);
  display:grid;grid-template-columns:repeat(4,1fr);z-index:45}
.botnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;color:var(--ink3);font-weight:600;position:relative;padding-top:2px}
.botnav .ic{font-size:16px;line-height:1;width:38px;height:24px;display:grid;place-items:center;
  border-radius:99px;transition:background .18s,color .18s,transform .18s}
.botnav .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
/* 5-6 แท็บ (CTS / Admin) ช่องแคบลง ย่อตัวอักษรให้ชื่อแท็บไม่โดนตัด */
.botnav.tight button{font-size:10px}
.botnav.tight .ic{font-size:15px;width:32px}
.botnav.tight2 button{font-size:9px;gap:2px}
.botnav.tight2 .ic{font-size:14px;width:28px;height:22px}
.botnav button[aria-selected="true"]{color:var(--tci,var(--brand-deep));font-weight:800}
.botnav button[aria-selected="true"] .ic{background:var(--tc,var(--brand-soft));color:var(--tci,var(--brand-deep));
  transform:translateY(-1px);box-shadow:0 3px 8px color-mix(in srgb,var(--tci,#5F4FB0) 22%,transparent)}
.botnav .cnt{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--bad);color:#fff;
  font-family:var(--mono);font-size:9.5px;border-radius:99px;padding:1px 5px;font-weight:700}

/* ============ DASHBOARD ============ */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;
  box-shadow:var(--sh1);display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .tn{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--brand-deep);line-height:1}
.tile .tl{font-size:11.5px;color:var(--ink2);font-weight:600;line-height:1.3;overflow:hidden}
@media(max-width:700px){.tiles{grid-template-columns:1fr 1fr}.tile:last-child{grid-column:span 2}
  .tile .tn{font-size:22px}}
/* การ์ดรายคน — รูป CTS + จำนวนคิวแยกตาม product */
.dgrid{display:grid;gap:10px;margin-bottom:12px}
@media(min-width:760px){.dgrid{grid-template-columns:1fr 1fr}}
@media(min-width:1180px){.dgrid{grid-template-columns:repeat(3,1fr)}}
.dcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));
  border-radius:16px;padding:12px 13px;box-shadow:var(--sh1)}
.dcard.sum{border-left-color:var(--brand-deep);background:#FBFAFE}
.dhead{display:flex;align-items:center;gap:10px}
.dhead img,.dhead .dic{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;
  box-shadow:0 0 0 3px var(--c,var(--line))}
.dhead .dic{display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep);
  font-size:19px;font-weight:700;box-shadow:0 0 0 3px var(--brand-soft)}
.dhead b{font-size:15px;font-weight:700;display:block;line-height:1.2}
.dhead em{display:block;font-style:normal;font-size:11px;color:var(--ink3);font-weight:500}
.dtot{text-align:right;flex:none}
.dtot b{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--ci,var(--brand-deep));line-height:1}
.dtot small{display:block;font-size:10px;color:var(--ink3);font-weight:600}
.dprods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px}
.dp{background:var(--paper);border-radius:12px;padding:7px 4px;text-align:center;min-width:0;opacity:.55}
.dp.on{background:var(--pc);opacity:1}
.dp b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;color:var(--ink3);line-height:1.1}
.dp.on b{color:var(--pi)}
.dp small{display:block;font-size:9px;font-weight:700;color:var(--ink3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp.on small{color:var(--pi);opacity:.85}

/* ============ COMMON ============ */
.page{max-width:1180px;margin:0 auto}
h1.pt{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 3px}
@media(min-width:940px){h1.pt{font-size:26px}}
.psub{color:var(--ink3);font-size:13px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh1)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);font-weight:700}
h3{font-size:14.5px;margin:0 0 10px;font-weight:700}
.muted{color:var(--ink3);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:10px 15px;font-weight:600;font-size:14px;box-shadow:var(--sh1)}
.btn.primary{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.btn.primary:disabled{background:#CFC9E2;border-color:#CFC9E2;cursor:not-allowed}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.bad{color:var(--bad);border-color:var(--bad-edge)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.ava{border-radius:50%;object-fit:cover;background:#eee;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c,var(--line))}
.ava.xs{width:22px;height:22px;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px var(--c,var(--line))}
.ava.s{width:28px;height:28px}
.ava.m{width:38px;height:38px}
.ava.l{width:46px;height:46px}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;border-radius:99px;
  padding:3px 8px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill.n{background:var(--paper);color:var(--ink2);border-color:var(--line)}

.qbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a3),var(--a5))}
.cts-row{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px 12px;margin-bottom:9px;
  border-left:5px solid var(--c,var(--line))}
.cts-name{font-weight:700;font-size:14.5px;line-height:1.2}
.cts-name em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:500}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
/* มือถือ: ช่องเช้า/บ่ายเรียงลงมาเป็นแถว ไม่บีบกันจนล้นจอ */
@media(max-width:700px){.slots{grid-template-columns:1fr}}
/* min-width:0 กันช่องที่มีข้อความยาว (เช่น product หลายตัว) ดันคอลัมน์จนการ์ดล้นออกนอกจอ */
.slot{border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;background:#fff;min-width:0}
.slot .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:block;font-weight:700}
.slot .st{font-size:13px;font-weight:700;margin-top:3px;display:block}
.slot .sd{font-size:10.5px;color:var(--ink3);font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ช่องว่าง — เขียวเข้มกว่าสีพาสเทลประจำตัว CTS จะได้เห็นทันทีว่าจองได้ */
.slot.free{background:#BFEAD5;border-color:#3E9E7A;border-width:2px}
.slot.free .lbl{color:#2C7458}
.slot.free .st{color:#0E6144;font-size:14px}
.slot.busy,.slot.booked{background:var(--c,#F2F1F7);border-color:transparent;color:var(--ci,var(--ink3));cursor:not-allowed}
.slot.pend{background:var(--warn-soft);border-color:var(--warn-edge)}
.slot.pend .st{color:#8A6C1B}
.slot.notime{background:repeating-linear-gradient(45deg,#F5F4F8,#F5F4F8 5px,#EEEDF4 5px,#EEEDF4 10px);
  color:var(--ink3);cursor:not-allowed;border-color:transparent}
.slot.event{background:var(--ma-soft);border-color:var(--ma-edge)}
.slot.event .st{color:var(--ma-ink)}
.slot.picked{box-shadow:inset 0 0 0 3px var(--ok);background:#94DDBD}

/* form */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f span{font-weight:400;color:var(--ink3)}
.in{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;background:#fff}
textarea.in{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--cc,var(--brand-deep));color:#fff;border-color:var(--cc,var(--brand-deep))}
.chip.prodchip{display:inline-flex;align-items:center;gap:7px}
.chip.prodchip::before{content:'';width:11px;height:11px;border-radius:50%;background:var(--cc);flex:none}
.chip.prodchip[aria-pressed="true"]{color:var(--ct,var(--ink))}
.chip.prodchip[aria-pressed="true"]::before{background:var(--ct);opacity:.5}
.tag{color:var(--ink)}
.picked-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.picked-item{display:flex;align-items:center;gap:8px;background:var(--ok-soft);border:1px solid var(--ok-edge);
  border-radius:12px;padding:8px 11px;font-size:13px}
.picked-item .idx{font-family:var(--mono);font-size:10.5px;color:var(--ok);font-weight:700;background:#fff;border-radius:6px;padding:2px 6px}
.picked-item button{color:var(--bad);font-size:12px;font-weight:700}
.picked-row{display:flex;flex-direction:column;gap:5px}
.timerow{display:flex;align-items:center;gap:7px;padding-left:6px}
.timerow .tl{font-size:11.5px;color:var(--ink3);font-weight:600;white-space:nowrap}
.in.tin{width:auto;flex:1;min-width:96px;padding:7px 9px;font-size:13.5px;border-radius:10px}
.t24{display:inline-flex;align-items:center;gap:5px}
.t24 b{color:var(--ink3);font-weight:700}
.t24 .tsel{width:auto;min-width:66px;padding:9px 8px;font-size:14px;font-family:var(--mono);font-weight:600;
  text-align:center;appearance:none;background-image:none}
.timerow .t24{flex:1}
.timerow .t24 .tsel{padding:7px 6px;font-size:13.5px;min-width:58px;flex:1}
.sdetail{background:#FCFBFE;border:1px dashed var(--line);border-radius:11px;padding:9px;margin:2px 0 0 6px}
.chip.sm2{padding:5px 10px;font-size:11.5px}
.chip.sm2::before{width:9px;height:9px}
.chip.attchip{display:inline-flex;align-items:center;gap:7px}
.chip.attchip .adot{width:11px;height:11px;border-radius:50%;flex:none}
.chip.attchip[aria-pressed="true"]{background:var(--cc);border-color:var(--ct);color:var(--ct)}
.chip.attchip[aria-pressed="true"] .adot{background:var(--ct)!important;opacity:.55}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:66px;height:66px;object-fit:cover;border-radius:11px;border:1px solid var(--line)}
.gapv{color:#B08A2E;font-size:12.5px;font-style:italic}
.formgrid{display:grid;gap:0}
@media(min-width:760px){.formgrid{grid-template-columns:1fr 1fr;gap:0 16px}
  .formgrid .full{grid-column:1/-1}}

/* request cards */
.reqgrid{display:grid;gap:13px}
@media(min-width:940px){.reqgrid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
.req{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1);display:flex;flex-direction:column}
.req-strip{height:5px;background:var(--pc,#ccc)}
.req-in{padding:13px 14px 14px;flex:1;display:flex;flex-direction:column}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.req-id{font-family:var(--mono);font-size:10.5px;color:var(--ink3);font-weight:700}
.req-clinic{font-weight:700;font-size:15.5px;margin-top:2px}
.status{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  border-radius:99px;padding:4px 9px;white-space:nowrap}
.status.pending{background:var(--warn-soft);color:#8A6C1B;border:1px solid var(--warn-edge)}
.status.approved{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-edge)}
.status.rejected,.status.cancelled{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-edge)}
.status.tbc{background:#EDE4FF;color:#5B3E9E;border:1px solid #C9B6F2}
.status.expired{background:#F2F1F6;color:var(--ink3);border:1px solid var(--line)}
.half.job.tbcjob,.slot.tbc{background:repeating-linear-gradient(45deg,#EDE4FF 0 7px,#F7F2FF 7px 14px);color:#5B3E9E}
/* กล่องแจ้งเตือนคิว TBC — สีแดง ให้ Sales เห็นชัดว่าเหลืออีกกี่วันก่อนปล่อยวันคืนระบบ */
.tbcbar{background:#FDE7E9;border:1.5px solid #E08A96;color:#9E2233;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:10px;font-weight:600}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;margin-top:12px;font-size:13px}
.kv dt{color:var(--ink3);font-size:12px}
.kv dd{margin:0}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:7px;padding:3px 8px}
.sess{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.sess .s{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--c,#F6F5FA);color:var(--ci,var(--ink2));
  border-radius:10px;padding:6px 9px}
.sess .s b{font-family:var(--mono);font-size:10.5px;opacity:.75}

/* modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(43,42,61,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;background:var(--paper);overflow:auto;box-shadow:var(--sh2);
  left:0;right:0;bottom:0;max-height:92dvh;border-radius:24px 24px 0 0;transform:translateY(102%);
  transition:transform .24s ease;pointer-events:none;visibility:hidden}
.sheet.on{transform:translateY(0);pointer-events:auto;visibility:visible}
@media(min-width:940px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(680px,92vw);max-height:88dvh;border-radius:22px;
    transform:translate(-50%,-46%) scale(.97);opacity:0;transition:opacity .18s ease, transform .18s ease}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;visibility:visible}
}
.sheet-head{position:sticky;top:0;background:var(--paper);padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheet-body{padding:16px}
.grab{width:42px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 11px}
@media(min-width:940px){.grab{display:none}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sheet h2{font-size:19px;margin:2px 0 0;font-weight:700;letter-spacing:-.02em}

/* notifications */
.nfeed{display:grid;gap:11px}
@media(min-width:940px){.nfeed{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));align-items:start}}
.ncard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1)}
.nhead{padding:10px 13px;color:#fff;font-weight:700;font-size:13px}
.nhead2{display:flex;align-items:center;gap:9px;padding:10px 13px;font-size:13px}
.nhead2 .nic{font-size:15px}
.nhead2 b{display:block;font-size:13.5px;line-height:1.2}
.nhead2 small{display:block;font-family:var(--mono);font-size:10px;opacity:.75;font-weight:600}
.nclinic{font-weight:700;font-size:15.5px;margin-bottom:2px}
.nwhen{display:flex;flex-direction:column;gap:3px;margin-top:9px}
.nwhen span{background:var(--paper);border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:600}
.nsess{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.nsess .s{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px 4px 4px;
  font-size:12px;font-weight:700}
.tl-allday{display:flex;align-items:flex-start;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:8px 10px;margin-bottom:8px}
.tl-allday .adlbl{width:46px;flex:none;font-family:var(--mono);font-size:9.5px;color:var(--ink3);font-weight:700;padding-top:6px;text-align:right}
.adlist{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.adchip{border-radius:9px;padding:6px 9px;text-align:left;font-family:inherit;background:var(--c,#eee);
  color:var(--ci,var(--ink));box-shadow:0 1px 3px rgba(43,42,61,.14);display:block}
.adchip b{display:block;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adchip span{font-size:9.5px;opacity:.85;font-weight:600}
.half.allday .slb{font-family:var(--sans);font-size:9.5px;font-weight:700}
.tl{position:relative;display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:8px 10px 8px 6px;overflow:hidden}
.tl-hours{width:46px;flex:none}
.tl-h{position:relative}
.tl-h span{position:absolute;top:-7px;right:4px;font-family:var(--mono);font-size:9.5px;color:var(--ink3);font-weight:600}
.tl-body{position:relative;flex:1;min-width:0}
.tl-line{border-top:1px solid var(--line2)}
.tl-empty{position:absolute;top:40%;left:0;right:0;text-align:center;color:var(--ink3);font-size:13px}
.tblock{position:absolute;border-radius:9px;padding:5px 8px;text-align:left;overflow:hidden;
  background:var(--c,#eee);color:var(--ci,var(--ink));font-family:inherit;box-shadow:0 1px 3px rgba(43,42,61,.14);
  display:flex;flex-direction:column;gap:1px}
.tblock.ma{background:var(--ma-soft);color:var(--ma-ink);border:1px dashed var(--ma-edge);font-size:11.5px}
.tb-h{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;font-weight:700;opacity:.9}
.tb-who{display:flex;gap:2px;margin-left:auto}
.tb-who i{width:8px;height:8px;border-radius:50%;display:block}
.tb-t{font-size:12px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-n{font-size:9.5px;opacity:.8;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tblock{line-height:1.25}
.upcday{border:1px solid var(--line);border-radius:13px;padding:10px 11px;margin-top:10px;background:#FCFBFE}
.upcday-h{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:7px}
.upcday-h .s{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px 3px 3px;
  font-size:11.5px;font-weight:700;margin-left:auto}
.upcline{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;padding:6px 0;border-top:1px dashed var(--line2)}
.upcline .tm{font-family:var(--mono);font-size:10.5px;color:var(--ink3);font-weight:700;white-space:nowrap;padding-top:3px}
.upcview{background:var(--paper);border-radius:13px;padding:11px 12px;margin-top:9px}
.upcview .idx{font-family:var(--mono);font-size:10.5px;font-weight:700;background:#fff;border-radius:6px;padding:2px 7px;color:var(--ink3)}
.dayblock{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;background:#fff}
.dayhead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.dayhead .dd{background:var(--brand-soft);color:var(--brand-deep);border-radius:11px;padding:6px 11px;font-weight:700;font-size:13px}
.itemcard{border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:10px;background:#FCFBFE}
.itemhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.itemhead b{font-size:13px}
.itemhead button{color:var(--bad);font-size:12px;font-weight:700;margin-left:auto}
.nbody{padding:13px;font-size:13px}
.divider{height:1px;background:var(--line2);margin:10px 0}
.copybox{background:#FAF9FD;border:1px dashed var(--line);border-radius:12px;padding:11px;margin-top:10px;
  font-family:var(--mono);font-size:11px;white-space:pre-wrap;color:var(--ink2);max-height:190px;overflow:auto}
.toast{position:fixed;bottom:calc(var(--navh) + 20px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:99px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;max-width:92%;
  text-align:center;box-shadow:var(--sh2);pointer-events:none}
@media(min-width:940px){.toast{bottom:26px}}
.toast.on{opacity:1}
.evrow{display:flex;gap:10px;align-items:center;background:var(--ma-soft);border:1px solid var(--ma-edge);
  border-radius:13px;padding:10px 12px;margin-bottom:8px;font-size:13px;color:var(--ma-ink)}
.evrow .muted{color:#C7D6F2}
.evrow.hol,.evrow.hol .muted{color:var(--hol-ink)}
.evrow.hol{background:var(--hol-bg);border-color:var(--hol-edge)}
.evrow.hol .d{color:var(--hol-ink)}
.evrow .d{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ma-ink);text-align:center;line-height:1.15}
.evrow button{color:var(--bad);font-weight:700;font-size:12px}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(min-width:760px){.team-grid{grid-template-columns:repeat(4,1fr)}}
.mini{display:flex;align-items:center;gap:8px;background:var(--c,#F6F5FA);border-radius:12px;padding:8px 9px;font-size:12.5px;font-weight:600}
.mini small{display:block;font-size:10.5px;color:var(--ink3);font-weight:500}
.empty{text-align:center;padding:34px 16px;color:var(--ink3)}
.empty .big{font-size:34px;margin-bottom:8px}

/* ---- responsive overrides (kept last so they win the cascade) ---- */
@media(min-width:940px){
  .topbar{display:none !important}
  .botnav{display:none !important}
  .side{display:flex !important}
  .main{padding:22px 26px 40px}
}
@media(max-width:939px){
  .side{display:none !important}
}
.wperson .nk,.wperson .nm{display:block}
.uchip .nm,.uchip .sb{display:block}
.rolebtn b,.rolebtn small{display:block}
</style>

<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head"><div class="grab"></div><div id="sheetHead"></div></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

/* ช่วงเวลามาตรฐานของแต่ละ slot — แก้ได้ที่นี่ */
const SLOT_DEF={am:{start:'09:00',end:'12:00'},pm:{start:'13:00',end:'16:30'}};
/* กติกาคำนวณเวลาว่างอัตโนมัติ:
   ถ้าคิวก่อนหน้าเลิกช้า ต้องเผื่อเวลาพักกลางวัน+เดินทาง BUFFER ก่อนรับคิวถัดไป
   เช่น คิวเช้า 10:00–13:00 → ช่วงบ่ายจะว่าง 15:00–18:00 */
const AUTO_RULE={bufferMin:120, sessionMin:180, minSessionMin:60, dayStart:'09:00', dayEnd:'18:00'};
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m;};
const toHM=v=>`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;
const availOf=(k,cid,slot)=>(state.avail[k]&&state.avail[k][cid])?state.avail[k][cid][slot]:null;
/* undefined = ไม่มีคิวข้างเคียง ใช้เวลามาตรฐาน · null = เวลาไม่พอ · object = หน้าต่างเวลาที่คำนวณได้ */
function autoWindow(k,cid,slot){
  const R=AUTO_RULE;
  const es=entriesOf(k,cid).filter(e=>!e.job.allDay);
  if(slot==='pm'){
    /* ดูคิวที่แตะช่วงเช้า แล้วเอาอันที่เลิกช้าที่สุด — คิวเช้าอาจมีหลายอัน */
    const ends=es.filter(e=>toMin(e.start)<toMin(SLOT_DEF.am.end)).map(e=>toMin(e.end));
    if(!ends.length)return undefined;
    const amEnd=Math.max(...ends);
    if(amEnd<=toMin(SLOT_DEF.am.end))return undefined;            // คิวเช้าเลิกตามปกติ ใช้เวลาบ่ายมาตรฐาน
    const start=Math.max(toMin(SLOT_DEF.pm.start), amEnd+R.bufferMin);
    const end=Math.min(start+R.sessionMin, toMin(R.dayEnd));
    return (end-start)<R.minSessionMin?null:{start:toHM(start),end:toHM(end),auto:true};
  }
  const starts=es.filter(e=>toMin(e.end)>toMin(SLOT_DEF.pm.start)).map(e=>toMin(e.start));
  if(!starts.length)return undefined;
  const pmStart=Math.min(...starts);
  if(pmStart>=toMin(SLOT_DEF.pm.start))return undefined;          // คิวบ่ายเริ่มตามปกติ ใช้เวลาเช้ามาตรฐาน
  const end=Math.min(toMin(SLOT_DEF.am.end), pmStart-R.bufferMin);
  const start=toMin(SLOT_DEF.am.start);
  return (end-start)<R.minSessionMin?null:{start:toHM(start),end:toHM(end),auto:true};
}
/* เวลาว่างที่โชว์ให้ Sales ในช่องนั้น = ช่วงที่คนซึ่งยังว่างจริงว่างอยู่ (คิดกติกาเผื่อพัก+เดินทางแล้ว)
   เดิมพิมพ์ SLOT_DEF ตรงๆ ทำให้บ่ายขึ้น 13:00 เสมอ ทั้งที่คิวเช้าเลิกสาย */
function slotWindow(k,slot){
  const w=teamPool().filter(c=>slotStatus(k,c.id,slot)==='free').map(c=>slotTime(k,c.id,slot));
  if(!w.length)return SLOT_DEF[slot];
  return {start:toHM(Math.min(...w.map(x=>toMin(x.start)))),end:toHM(Math.max(...w.map(x=>toMin(x.end))))};
}
function setAvail(k,cid,slot,t){
  if(!state.avail[k])state.avail[k]={};
  if(!state.avail[k][cid])state.avail[k][cid]={am:null,pm:null};

}
/* เวลาที่ใช้จริงของช่องนั้น: ถ้ามีคิว = เวลาคิว, ถ้าว่าง = เวลาว่างที่แก้ไว้ ไม่งั้นใช้ค่าเริ่มต้น */
function slotTime(k,cid,slot){
  const j=jobOf(k,cid,slot);
  if(j)return {start:j.start||SLOT_DEF[slot].start,end:j.end||SLOT_DEF[slot].end};
  const a=availOf(k,cid,slot);
  if(a&&a.closed)return SLOT_DEF[slot];
  if(a)return {start:a.start,end:a.end};
  const w=autoWindow(k,cid,slot);
  if(w)return {start:w.start,end:w.end,auto:true};
  return SLOT_DEF[slot];
}

  const own=able.filter(c=>!needsSenior(c.id,prods));
  const withSr=able.filter(c=>needsSenior(c.id,prods));
  return own.map(c=>c.id).concat(withSr.slice(0,srFree).map(c=>c.id));
}

/* ponytail: re-render ของ sheet เดิม (เช่นกดเลือก CTS ในฟอร์ม) ต้องคงตำแหน่ง scroll ไว้ ไม่งั้นเด้งขึ้นบนบนมือถือ
   ใช้หัวเรื่องเป็นตัวบอกว่าใบเดิมหรือใบใหม่ — ฟอร์มเดียวกันเรนเดอร์ซ้ำหัวเรื่องไม่เปลี่ยน ส่วนใบใหม่ต้องเริ่มที่บนสุด */
function openSheet(h,b){const s=$('sheet'),y=s.classList.contains('on')&&s._h===h?s.scrollTop:0;s._h=h;
  $('sheetHead').innerHTML=h;$('sheetBody').innerHTML=b;s.classList.add('on');$('scrim').classList.add('on');s.scrollTop=y;}
function closeSheet(){$('sheet').classList.remove('on');$('scrim').classList.remove('on');}
/* ponytail: บนมือถือทั้งหน้าเว็บคือตัวเลื่อน — พอเขียน innerHTML ทับ เนื้อหาหายไปชั่วขณะ
   เบราว์เซอร์เลยดีด scroll กลับขึ้นบนสุด (กดชิปเลือกข้อมูลทีไรหน้าเด้ง)
   ทุกจุดที่เรนเดอร์ใหม่ต้องเขียนผ่าน setHTML — จำตำแหน่งไว้แล้วคืนทีเดียวตอนเรนเดอร์ครบทั้งชุด
   (คืนทันทีไม่ได้ เพราะบางหน้าเขียนสองท่อน เช่น renderCal เขียน view ก่อนแล้วค่อยเติมตารางใน calshell) */
let _keepY=null;
function setHTML(el,s){
  if(_keepY===null){const k=_keepY={y:window.scrollY||0};
    Promise.resolve().then(()=>{_keepY=null;if((window.scrollY||0)!==k.y)window.scrollTo?.(0,k.y);});}
  el.innerHTML=s;
}
/* เปลี่ยนแท็บคือเปลี่ยนหน้า — อันนี้ต้องเริ่มที่บนสุด ไม่ใช่คงตำแหน่งเดิม */
function toTop(){if(_keepY)_keepY.y=0;else window.scrollTo?.(0,0);}
$('scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

async function restoreLogin(){

    if(!state.tbcMode&&state.draft&&state.picks.length>state.draft.slots)state.picks=state.picks.slice(0,state.draft.slots);
    renderCal();toast(state.tbcMode?'โหมดล็อกวัน TBC — เลือกได้หลายวัน':'กลับสู่โหมดคำขอปกติ');};

/* ---- month ---- */
/* ===== คิวชุดเดียวกันที่ต่อเนื่องหลายวัน =====
   วาดเป็นแถบเดียวลากคร่อมวัน แทนกล่องแยกวันละใบ จะได้เห็นว่างานลากยาวถึงเมื่อไหร่
   ชุดเดียวกัน = มาจากคิวที่ CTS ลงเองใบเดียวกัน (selfId) หรือคำขอใบเดียวกัน (reqId) */
const seriesId=j=>j.selfId?'se'+j.selfId:j.reqId?'rq'+j.reqId:null;
function weekSpans(days){          // days = 7 ช่องของสัปดาห์นั้น (null = ช่องนอกเดือน)
  const bySid=new Map();
  days.forEach((g,i)=>{if(!g)return;g.jobs.forEach(e=>{const s=seriesId(e.job);if(!s)return;
    if(!bySid.has(s))bySid.set(s,[]);bySid.get(s).push({i,e});});});
  const bars=[],skip=new Set();    // skip = "คอลัมน์|key" ที่ถูกแถบยาวกินไปแล้ว ไม่ต้องวาดซ้ำในช่อง
  bySid.forEach(list=>{
    const cols=[...new Set(list.map(x=>x.i))].sort((a,b)=>a-b);
    let run=[cols[0]];
    const flush=()=>{
      if(run.length>1){
        bars.push({c0:run[0],n:run.length,e:list.find(x=>x.i===run[0]).e,k:days[run[0]].k});
        run.forEach(i=>list.filter(x=>x.i===i).forEach(x=>skip.add(i+'|'+x.e.key)));
      }
      run=[];
    };
    for(let p=1;p<cols.length;p++){
      if(cols[p]===cols[p-1]+1)run.push(cols[p]);else{flush();run=[cols[p]];}
    }
    flush();
  });
  bars.sort((a,b)=>a.c0-b.c0||b.n-a.n);
  const lane=[];                   // เลนละ 1 แถบ แถบที่ไม่ทับกันใช้เลนเดียวกันได้
  bars.forEach(b=>{let L=lane.findIndex(end=>end<=b.c0);if(L<0){L=lane.length;lane.push(0);}
    lane[L]=b.c0+b.n;b.ln=L;});
  return {bars,skip,lanes:lane.length};
}
function spanBar(b){
  const nicks=b.e.who.map(i=>byId(i).nick).join(', ');
  return `<button class="spanbar" data-job="${b.k}|${b.e.key}" title="${nicks} · ${esc(b.e.job.title||'')}"
    style="${jobStyle({...b.e.job,attendees:b.e.who},b.e.who[0])};--ln:${b.ln};left:calc(${b.c0}*100%/7 + 3px);width:calc(${b.n}*100%/7 - 6px)">
    <span class="etx">${okMark(b.e.job)}${leadText(b.e.job)?leadText(b.e.job)+' · ':''}${esc(b.e.job.title||'งาน')}${nicks?' · '+nicks:''}</span></button>`;
}
function monthHTML(){
  const y=state.month.getFullYear(),mo=state.month.getMonth();
  const start=new Date(y,mo,1).getDay(),last=new Date(y,mo+1,0).getDate();
  const vis=visibleCTS(),total=vis.length;
  const names=canSeeNames();
  /* เก็บข้อมูลรายวันไว้ก่อน แล้วค่อยแบ่งเป็นสัปดาห์ — ต้องรู้ว่าวันไหนถูกแถบยาวกินไปแล้ว */
  const grid=[];
  for(let i=0;i<start;i++)grid.push(null);
  for(let d=1;d<=last;d++){const dt=new Date(y,mo,d),k=key(dt);
    /* เรียงตามเวลาจริงจาก dayEntries — คิวทั้งวันขึ้นก่อน ไม่ยึดช่องเช้า/บ่าย จึงไม่ซ้ำและไม่จำกัด 2 คิว */
    grid.push({d,dt,k,jobs:names?dayEntries(k).filter(e=>e.job&&jobTypeOk(e.job)):[]});}
  while(grid.length%7)grid.push(null);

  let rows='';
  for(let w=0;w<grid.length;w+=7){
    const week=grid.slice(w,w+7);
    const sp=names?weekSpans(week):{bars:[],skip:new Set(),lanes:0};
    const pad=sp.lanes?`<span class="spanpad" style="height:${sp.lanes*17-3}px"></span>`:'';
    const cells=week.map((g,ci)=>{
    if(!g)return '<div class="mcell pad"></div>';
    const {d,dt,k}=g;
    const hol=holidayOf(k);
    const wknd=isWeekend(dt);
    const past=dt<TODAY&&k!==key(TODAY),today=k===key(TODAY);
    const sel=state.picks.some(p=>p.date===k);
    let inner='';
    {
      if(names){
        const jobs=g.jobs.filter(e=>!sp.skip.has(ci+'|'+e.key));
        const ma=maTypeOk()?dayEvents(k):[];
        /* มือถือ: แถบชื่องานบรรทัดเดียวเรียงกัน (แบบ Google Calendar) — เดิมเป็นจุดสีซึ่งดูไม่ออกว่างานอะไร
           จอใหญ่: แถบ 2 บรรทัด มีเวลาและชื่อคนกำกับ */
        const one=NARROW();
        const chips=ma.map(e=>one
            ? `<span class="evchip ma one">${esc(e.title)}</span>`
            : `<span class="evchip ma"><span class="etx">MA · ${esc(e.title)}</span></span>`)
          .concat(jobs.map(o=>{const nicks=o.who.map(i=>byId(i).nick).join(', ');
            if(one)return `<button class="evchip one" data-job="${k}|${o.key}" title="${nicks} · ${esc(o.job.title||'')}"
              style="${jobStyle({...o.job,attendees:o.who},o.who[0])}">${okMark(o.job)}${esc(o.job.title||'งาน')}</button>`;
            return `<button class="evchip two" data-job="${k}|${o.key}" title="${nicks} · ${esc(o.job.title||'')}"
              style="${jobStyle({...o.job,attendees:o.who},o.who[0])}">
              <span class="l1"><span class="cdot"></span><span class="sl">${timeLabel(o.job,o)}</span>
                <span class="who">${nicks}</span></span>
              <span class="etx">${okMark(o.job)}${leadText(o.job)?leadText(o.job)+' · ':''}${esc(o.job.title||'')}</span></button>`;}));
        const cap=one?4:3;
        inner=chips.slice(0,cap).join('')+(chips.length>cap?`<span class="evmore">+${chips.length-cap}</span>`:'');
      }else{
        const lab=sl=>NARROW()?(sl==='am'?'AM':'PM'):(sl==='am'?'เช้า':'บ่าย');
        const blk=sl=>{
          const blocked=maDay(k)||vis.some(c=>eventFor(k,c.id,sl));
          const f=freeIds(k,sl).length;
          if(blocked)return `<span class="slotblk ma"><span class="lb">${lab(sl)}</span><span class="nb">MA</span></span>`;
          if(gateBlocked())return `<span class="slotblk gate"><span class="lb">${lab(sl)}</span><span class="nb">${NARROW()?'?':'เลือก Product'}</span></span>`;
          if(!f)return `<span class="slotblk full"><span class="lb">${lab(sl)}</span><span class="nb">${NARROW()?'—':'เต็ม'}</span></span>`;
          return `<span class="slotblk" style="background:${rampColor(f,total)};color:${f/total>.6?'#0C4F36':'#26694E'}">
            <span class="lb">${lab(sl)}</span><span class="nb">${f}</span></span>`;
        };
        /* วันหยุดใช้รูปแบบเดียวกับเสาร์–อาทิตย์: ขอคิวได้ แต่ไม่โชว์จำนวนคิวว่าง */
        inner=(wknd||hol)
          ? `<div class="wkndnote">${hol?esc(hol.name):(freeIds(k,'am').length+freeIds(k,'pm').length)
              ?'เสาร์–อาทิตย์':'ไม่มีคิวว่าง'}</div>`
          : `<div class="blks">${blk('am')}${blk('pm')}</div>`;
      }
    }
    return `<div class="mcell${wknd?' wknd':''}${hol?' hol':''}${past?' past':''}${today?' today':''}${sel?' sel':''}"
      ${past?'':'data-d="'+k+'" role="button" tabindex="0"'} aria-label="${fmtDate(k)}${hol?' '+hol.name:''}">
      <span class="dn"><b>${d}</b>${dayEvents(k).length&&!names?'<span style="color:var(--ma)">●</span>':''}</span>
      ${pad}${inner}${hol&&names?`<span class="holname">${esc(hol.name)}</span>`:''}</div>`;
    }).join('');
    rows+=`<div class="mweek">${cells}${sp.bars.map(spanBar).join('')}</div>`;
  }
  return `<div class="dow">${THDOW.map((x,i)=>`<span class="${i===0?'sun':''}">${x}</span>`).join('')}</div>
    <div class="mgrid wk">${rows}</div>${legend()}`;
}

/* ---- week ---- */
function weekHTML(){
  const days=[];for(let i=0;i<7;i++){const d=new Date(state.weekStart);d.setDate(d.getDate()+i);days.push(d);}
  /* มือถือ: ย่อคอลัมน์ชื่อ/ช่วงเวลา จาก 160px เหลือ 72px — เดิมกินครึ่งจอ เห็นได้แค่ 2 วัน */
  const gt=NARROW()?`68px repeat(${days.length},minmax(62px,1fr))`:`160px repeat(${days.length},minmax(88px,1fr))`;
  const head=`<div class="wrow whead" style="--gt:${gt}">
    <div class="wperson"><span class="qlbl">${canSeeNames()?'CTS':'ช่วงเวลา'}</span></div>
    ${days.map(d=>`<div class="wdate${key(d)===key(TODAY)?' td':''}${holidayOf(key(d))?' holh':''}">
      <div class="d">${d.getDate()}</div><div class="m">${THDOW[d.getDay()]} · ${ENMON[d.getMonth()]}</div></div>`).join('')}</div>`;

  if(canSeeNames()){
    const rows=visibleCTS().map(c=>`<div class="wrow" style="--gt:${gt}">
      <div class="wperson" style="border-left:5px solid ${pal(c.id).c}">${face(c.id,'s')}
        <span><span class="nk">${c.nick}</span><span class="nm">${c.name}</span></span></div>
      ${days.map(d=>{const k=key(d),hol=holidayOf(k);
        /* วันหยุดก็ยังลงคิวงานได้ — โชว์ชื่อวันหยุดกำกับ แล้วต่อด้วยคิวจริงของวันนั้น */
        /* ปฏิทิน CTS แสดงเฉพาะงานที่มีจริง ตามเวลาจริง กี่คิวก็ได้ — ไม่ต้องแบ่งเช้า/บ่าย
           คิวทั้งวันได้คลาส allday = เต็มช่อง */
        const ev=maTypeOk()?(eventFor(k,c.id,'am')||eventFor(k,c.id,'pm')):null;
        const html=(hol?`<span class="holtag" style="display:block;padding:2px 0 3px">${esc(hol.name)}</span>`:'')
          +(ev?`<span class="half mah"><span class="slb">MA</span>${esc(ev.type)}</span>`:'')
          +entriesOf(k,c.id).filter(e=>jobTypeOk(e.job)).map(e=>`<button class="half job${e.job.allDay?' allday':''}${e.job.kind==='tbc'?' tbcjob':''}"
            data-job="${k}|${e.key}" style="${jobStyle({...e.job,attendees:e.who},c.id)}">
            <span class="slb">${timeLabel(e.job,e)}</span>
            <span class="etx2">${okMark(e.job)}${leadText(e.job)?leadText(e.job)+' · ':''}${esc(e.job.title||'ติดงาน')}${e.job.kind==='pend'?' (รออนุมัติ)':e.job.kind==='tbc'?' (TBC)':''}</span>
            ${e.job.detail?`<span class="etx3">${esc(e.job.detail)}</span>`:''}
            ${upLabel(e.job)?`<span class="etx4">${esc(upLabel(e.job))}</span>`:''}</button>`).join('');
        return `<div class="wcell${hol?' holc2':''}">${html||'<span class="muted" style="font-size:11px">—</span>'}</div>`;}).join('')}</div>`).join('');
    return `<div class="wscroll"><div class="wgrid">${head}${rows}</div></div>${legend()}`;
  }

  const total=teamPool().length;
  const rows=['am','pm'].map(sl=>`<div class="srow" style="--gt:${gt}">
    <div class="slabel"><b>${sl==='am'?'ช่วงเช้า':'ช่วงบ่าย'}</b><small>${sl==='am'?'09:00–12:00':'13:00–16:30'}</small></div>
    ${days.map(d=>{const k=key(d),hol=holidayOf(k);
      const bl=maDay(k)||teamPool().some(c=>eventFor(k,c.id,sl));
      const f=freeIds(k,sl).length;
      const picked=state.picks.some(p=>p.date===k&&p.slot===sl);
      /* วันหยุดใช้รูปแบบเดียวกับเสาร์–อาทิตย์: ขอคิวได้ แต่ไม่โชว์จำนวนคิวว่าง */
      const quiet=isWeekend(d)||hol;
      return `<div class="scell${isWeekend(d)?' wkndcell':''}${hol?' wcell holc2':''}">
        ${quiet?`<span class="sdot" style="background:var(--line)"></span><span class="sbig" style="color:${hol?'var(--hol-ink)':'var(--ink3)'};font-size:12px">${hol?esc(hol.name):'เสาร์–อาทิตย์'}</span>`
          :`<span class="sdot" style="background:${bl?'var(--ma)':rampColor(f,total)}"></span>
            <span class="sbig" style="color:${f&&!bl?'var(--ok)':'var(--ink3)'}">${bl?'MA':gateBlocked()?'?':f}<small>${bl?'งานกลาง':gateBlocked()?'เลือก Product':'ว่าง / '+total}</small></span>`}
        <button class="btn sm ${picked?'ok':''}" ${(!f||bl)?'disabled':''} data-book="${k}" data-slot="${sl}">
          ${picked?'✓':'จอง'}</button></div>`;}).join('')}</div>`).join('');
  return `<div class="wscroll"><div class="swrap">${head}${rows}</div></div>${legend()}`;
}

/* ---- picking ---- */
/* โหมดล็อกวัน TBC: เลือกได้หลายวันเกินจำนวน session ที่ module กำหนด (สูงสุด 10 กันเผลอ) */
function needSlots(){return state.tbcMode?10:(state.draft?state.draft.slots:99);}
function togglePick(k,slot,ctsId){
  const i=state.picks.findIndex(p=>p.date===k&&p.slot===slot&&(ctsId?p.ctsId===ctsId:true));
  if(i>=0){state.picks.splice(i,1);return true;}
  if(state.picks.some(p=>p.date===k&&p.slot===slot))return toast('ช่วงเวลานี้เลือกไปแล้วในคำขอนี้'),false;
  if(state.picks.length>=needSlots())return toast(state.tbcMode?'ล็อกได้สูงสุด 10 วันต่อคำขอ':`คำขอนี้ใช้ ${needSlots()} slot — ลบอันเก่าก่อน`),false;
  const w=ctsId?slotTime(k,ctsId,slot):SLOT_DEF[slot];
  state.picks.push({date:k,slot,ctsId:ctsId||null,start:w.start,end:w.end});return true;
}
function quickPick(k,slot,ctsId){
  const cid=ctsId||null;
  if(togglePick(k,slot,cid)){renderCal();
    if(!state.draft&&state.picks.length===1)toast('เลือกช่วงเวลาแล้ว — กด "สร้างคำขอ" ด้านล่าง');}
}
function pickBar(){
  const need=state.tbcMode?null:(state.draft?state.draft.slots:null);
  const ok=need?state.picks.length===need:state.picks.length>0;
  return `<div class="card" style="border-color:var(--ok-edge);position:sticky;bottom:12px;box-shadow:var(--sh2)">
    <div class="row" style="flex-wrap:wrap"><div class="grow"><div class="eyebrow">เลือกไว้</div>
      <div style="font-weight:700;font-size:18px">${state.picks.length}${need?` / ${need}`:''} <span class="muted" style="font-size:13px">slot</span></div></div>
      <button class="btn ghost" id="btnClr">ล้าง</button>
      <button class="btn primary" id="btnCont" ${ok?'':'disabled'}>${state.draft?'กลับไปกรอกฟอร์ม':'สร้างคำขอ'}</button></div>
    ${prodGateOn()?`<div class="row" style="margin-top:9px;background:#EDE4FF;border:1px solid #C9B6F2;border-radius:12px;padding:8px 11px">
      <label class="grow" style="font-size:12.5px;font-weight:700;color:#4A2F87">🔒 ล็อกหลายวันไว้ก่อน (คิว TBC)</label>
      <input type="checkbox" id="tbcSw" ${state.tbcMode?'checked':''} style="width:21px;height:21px"></div>`:''}
    <div class="picked-list">${state.picks.map((p,i)=>`<div class="picked-item"><span class="idx">S${i+1}</span>
      ${p.ctsId?face(p.ctsId,'xs'):''}<span class="grow">${fmtDate(p.date)} · ${p.slot==='am'?'เช้า':'บ่าย'}${p.ctsId?' · '+byId(p.ctsId).nick:''}</span></div>`).join('')}</div></div>`;
}


/* รายละเอียดคิว — ดึงข้อมูลจากคำขอที่อนุมัติ/รออนุมัติมาแสดงอัตโนมัติ */

/* ---- ปฏิทินสำหรับ UPC : เห็นคิวเทรน UPC + งานกลาง MA + วันหยุด (ไม่มี slot ว่าง) ---- */
function upcChip(o){
  const items=o.day.items||[];
  const first=items[0]||{};
  const pr=first.product;
  return `<button class="evchip two" data-upc="${o.day.date}"
    style="--c:${pr?PRODHEX[pr]:'#E4E0F3'};--ci:${pr?pink(pr):'var(--brand-deep)'}">
    <span class="l1"><span class="cdot"></span><span class="sl">${first.start||'—'}–${first.end||'—'}</span>
      <span class="who">${o.r.status==='approved'?'✓':'🕒'}</span></span>
    <span class="etx">${esc(first.clinic||'ยังไม่ระบุคลินิก')}${items.length>1?` +${items.length-1}`:''}</span></button>`;
}
function upcMonthHTML(){
  const y=state.month.getFullYear(),mo=state.month.getMonth();
  const start=new Date(y,mo,1).getDay(),last=new Date(y,mo+1,0).getDate();
  let cells='';
  for(let i=0;i<start;i++)cells+='<div class="mcell pad"></div>';
  for(let d=1;d<=last;d++){
    const dt=new Date(y,mo,d),k=key(dt),hol=holidayOf(k);
    const off=!isWorkday(dt),past=dt<TODAY&&k!==key(TODAY),today=k===key(TODAY);
    const evs=state.events.filter(e=>e.date===k);
    const ups=upcOnDate(k);
    const inner=`${hol?`<span class="holname">${esc(hol.name)}</span>`:''}
      ${evs.map(e=>`<span class="evchip ma"><span class="etx">MA · ${esc(e.title)}</span></span>`).join('')}
      ${ups.map(upcChip).join('')}`;
    cells+=`<div class="mcell${off?' off':''}${hol?' hol':''}${past?' past':''}${today?' today':''}">
      <span class="dn"><b>${d}</b></span>${inner}</div>`;
  }
  return `<div class="dow">${THDOW.map((x,i)=>`<span class="${i===0?'sun':''}">${x}</span>`).join('')}</div>
    <div class="mgrid">${cells}</div>
    <div class="legend"><span class="lr"><i style="background:#E4E0F3"></i>คิวเทรน UPC</span>
      <span class="lr"><i style="background:var(--ma-soft);box-shadow:inset 0 0 0 1px var(--ma-edge)"></i>งานกลาง MA</span>
      <span class="lr"><i style="background:var(--hol-bg);box-shadow:inset 0 0 0 1px var(--hol-edge)"></i>วันหยุด</span>
      <span class="lr">🕒 รออนุมัติ · ✓ อนุมัติแล้ว</span></div>`;
}

      ${ups.map(o=>{const items=o.day.items||[];

/* ================= คิวงานที่ CTS ลงเอง (นอกเหนือจากคำขอของ Sales) ================= */
const slotsOfRange=(st,en)=>{
  const a=toMin(st),b=toMin(en),out=[];
  if(a<toMin(SLOT_DEF.am.end))out.push('am');
  if(b>toMin(SLOT_DEF.pm.start))out.push('pm');
  return out.length?out:['am'];
};
function syncSelf(ev){
  clearSelf(ev.id);
  const sl=ev.allDay?['am','pm']:slotsOfRange(ev.start,ev.end);
  dateRange(ev.date,ev.dateEnd||ev.date).forEach(k=>{
    ev.attendees.forEach(cid=>sl.forEach(x=>{
      setJob(k,cid,x,{kind:'busy',title:ev.title,product:ev.product||null,selfId:ev.id,allDay:!!ev.allDay,
        attendees:ev.attendees.slice(),
        start:ev.allDay?SLOT_DEF.am.start:ev.start,end:ev.allDay?SLOT_DEF.pm.end:ev.end,owner:ev.owner});
    }));
  });
}
/* ทุกคนที่ไปงานของ session นี้ — ผู้เทรนที่หัวหน้าจัดให้ + คนที่ CTS เพิ่มเข้ามาเอง */
const reqWho=s=>[s.ctsId].concat(s.extra||[]).filter(Boolean);
/* เขียนคิวของ session ลง sched ให้ครบทุกคน คิวว่างฝั่ง Sales จะได้ถูกตัดตรง
   prevWho = คนชุดเดิม ต้องล้างออกก่อน ไม่งั้นคนที่ถูกเอาออกจะยังติดคิวค้าง */
function syncReqJob(r,s,prevWho){
  (prevWho||[]).forEach(id=>{const j=jobOf(s.date,id,s.slot);if(j&&j.reqId===r.id)setJob(s.date,id,s.slot,null);});
  reqWho(s).forEach(id=>setJob(s.date,id,s.slot,stampNow({
    kind:r.status==='approved'?'booked':'pend',title:s.sTitle||s.sProduct||r.clinic||'Training',
    product:s.sProduct||r.product,reqId:r.id,
    start:s.start||SLOT_DEF[s.slot].start,end:s.end||SLOT_DEF[s.slot].end})));
}
/* CTS แก้คิวที่มาจากคำขอที่อนุมัติแล้ว — หัวข้อ เวลา และคนที่ไปด้วย เหมือนคิวที่ลงเอง
   ผู้เทรนหลักที่หัวหน้าจัดให้แก้ที่นี่ไม่ได้ ต้องให้หัวหน้าเปลี่ยนที่ "จัด / เปลี่ยน CTS" */
function openReqSession(reqId,sIdx,keep){
  const r=state.requests.find(x=>x.id===reqId);if(!r)return;
  const s=r.sessions[+sIdx];if(!s)return;
  const auto=s.sProduct||r.clinic||'Training';
  const D=keep||{title:s.sTitle||'',start:s.start||SLOT_DEF[s.slot].start,
    end:s.end||SLOT_DEF[s.slot].end,extra:(s.extra||[]).slice()};
  openSheet(`<div class="eyebrow">${r.id} · ${fmtDate(s.date)}</div><h2>แก้ไขคิวงานนี้</h2>
    <div class="muted" style="padding:6px 0 2px">คิวจากคำขอที่อนุมัติแล้ว — แก้หัวข้อ เวลา และคนที่ไปด้วยได้</div>`,
  `<div class="card">
    <label class="f">หัวข้องาน <span>· เว้นว่าง = ใช้ "${esc(auto)}"</span></label>
    <input class="in" id="rsTitle" value="${esc(D.title)}" placeholder="${esc(auto)}">
    <div class="formgrid">
      <div><label class="f">เริ่ม</label>${t24('rsStart',D.start,s.slot)}</div>
      <div><label class="f">ถึง</label>${t24('rsEnd',D.end,s.slot)}</div></div>
    <label class="f">ใครไปงานนี้บ้าง <span>· เลือกได้หลายคน สีจะรวมกันในปฏิทิน</span></label>
    <div class="chips"><span class="chip attchip" aria-pressed="true" style="--cc:${pal(s.ctsId).c};--ct:${pal(s.ctsId).ci};opacity:.75">
      <span class="adot" style="background:${pal(s.ctsId).c}"></span>${byId(s.ctsId).nick} · ผู้เทรนหลัก</span>

function jobStyle(j,fallbackId){
  const ids=(j&&j.attendees&&j.attendees.length?j.attendees:[fallbackId]).filter(Boolean);
  if(ids.length<2)return `--c:${pal(ids[0]||fallbackId).c};--ci:${pal(ids[0]||fallbackId).ci}`;
  const step=14,stops=[];
  ids.forEach((id,i)=>{stops.push(`${pal(id).c} ${i*step}px`,`${pal(id).c} ${(i+1)*step}px`);});
  return `background:repeating-linear-gradient(45deg,${stops.join(',')});color:${pal(ids[0]).ci};--ci:${pal(ids[0]).ci}`;
}

/* ================= มุมมองรายวันแบบไทม์ไลน์ (สำหรับ CTS / Admin) ================= */
const DAY_VIEW={from:7*60,to:20*60,rowH:40};
/* งานจริงของวันนั้นตามเวลาจริง — อ่านจากต้นทาง (คิวที่ CTS ลงเอง + คำขอที่จัด CTS แล้ว)
   ไม่ได้อ่านจาก state.sched เพราะ sched มีแค่ช่องเช้า/บ่าย ทำให้คิวคร่อมเที่ยงถูกเขียนลง 2 ช่อง
   แล้วโผล่ซ้ำในปฏิทิน และคิวที่ 3 ของวันจะหายไป
   sched ยังทำหน้าที่เดิมทุกอย่าง คือเป็นตัวนับคิวว่างให้ฝั่ง Sales */
function dayEntries(k,pool){
  const vis=pool||visibleCTS().map(c=>c.id);   // pool ระบุเองได้ — การคำนวณคิวว่างต้องไม่ขึ้นกับตัวกรองหน้าจอ
  const out=[];
  const put=(key,job,who)=>{const w=who.filter(i=>vis.includes(i));
    if(w.length)out.push({key,job,start:job.start,end:job.end,who:w,anchor:{k,cid:w[0]}});};
  state.selfEvents.forEach(ev=>{
    if(!dateRange(ev.date,ev.dateEnd||ev.date).includes(k))return;
    put('se-'+ev.id,{kind:'busy',title:ev.title,detail:ev.detail||'',product:ev.product||null,topics:ev.topics||[],
      selfId:ev.id,emailOk:!!ev.emailOk,allDay:!!ev.allDay,attendees:ev.attendees.slice(),owner:ev.owner,upBy:ev.upBy,upAt:ev.upAt,
      start:ev.allDay?SLOT_DEF.am.start:ev.start,end:ev.allDay?SLOT_DEF.pm.end:ev.end},ev.attendees);
  });
  state.requests.forEach(r=>{
    if(r.status==='rejected'||r.status==='cancelled')return;   // คิวยกเลิก = หายจากปฏิทิน CTS
    (r.sessions||[]).forEach((s,i)=>{
      if(s.date!==k||!s.ctsId)return;
      const day=(r.days||[]).find(x=>x.date===k);
      const it=(day&&(day.items||[])[0])||{};
      const full=s.slot==='day';
      /* sTitle / extra = ของที่ CTS แก้เองหลังคำขอถูกอนุมัติ (หัวข้อ และคนที่ไปด้วย) */
      put(r.id+'-'+i,{kind:r.status==='approved'?'booked':r.status==='tbc'?'tbc':'pend',
        title:r.mode==='upc'?upcDayLabel(day||{items:[]}).replace(/&amp;/g,'&'):(s.sTitle||s.sProduct||r.clinic||'Training'),
        detail:s.sTopic||r.topic||'',product:s.sProduct||r.product||it.product||null,
        reqId:r.id,sIdx:i,emailOk:!!s.emailOk,allDay:full,upBy:s.upBy,upAt:s.upAt,
        start:s.start||it.start||SLOT_DEF[full?'am':s.slot].start,
        end:s.end||it.end||SLOT_DEF[full?'pm':s.slot].end},reqWho(s));
    });
  });
  state.events.filter(e=>e.date===k).forEach(e=>{
    if(e.cts!=='all'&&!e.cts.some(i=>vis.includes(i)))return;
    out.push({key:'ma-'+e.id,ma:e,start:e.slot==='pm'?SLOT_DEF.pm.start:SLOT_DEF.am.start,
      end:e.slot==='am'?SLOT_DEF.am.end:SLOT_DEF.pm.end,who:[]});
  });
  const ad=x=>x.job&&x.job.allDay?1:0;
  return out.sort((a,b)=>ad(b)-ad(a)||toMin(a.start)-toMin(b.start)||toMin(a.end)-toMin(b.end));
}
/* คิวของ CTS คนเดียวในวันนั้น เรียงตามเวลาจริง — ใช้วาดปฏิทินรายสัปดาห์/รายเดือน และคำนวณคิวว่าง */
const entriesOf=(k,cid)=>dayEntries(k,[cid]).filter(e=>e.job);
function layoutEntries(list){
  const cols=[];const placed=[];
  list.forEach(e=>{
    const s=toMin(e.start),en=toMin(e.end);
    let ci=cols.findIndex(c=>c<=s);
    if(ci<0){ci=cols.length;cols.push(en);}else cols[ci]=en;
    placed.push({...e,col:ci});
  });
  const n=Math.max(1,cols.length);
  return {items:placed,n};
}
function timelineHTML(k){
  const all=dayEntries(k);
  const allDay=all.filter(e=>e.job&&e.job.allDay);
  const timed=all.filter(e=>!(e.job&&e.job.allDay));
  const {items,n}=layoutEntries(timed);
  const {from,to,rowH}=DAY_VIEW;
  const hours=[];for(let h=from/60;h<=to/60;h++)hours.push(h);
  const H=(to-from)/60*rowH;
  const blocks=items.map(e=>{
    const s=Math.max(toMin(e.start),from),en=Math.min(toMin(e.end),to);
    const top=(s-from)/60*rowH, h=Math.max(30,(en-s)/60*rowH-3);
    const w=100/n, left=e.col*w;
    if(e.ma)return `<div class="tblock ma" style="top:${top}px;height:${h}px;left:calc(${left}% + 2px);width:calc(${w}% - 5px)">
      <b>${e.start}</b> MA · ${esc(e.ma.title)}</div>`;
    const j=e.job,ids=e.who.length?e.who:[e.anchor.cid];
    const style=jobStyle({...j,attendees:ids},ids[0]);
    return `<button class="tblock" data-job="${k}|${e.key}"
      style="top:${top}px;height:${h}px;left:calc(${left}% + 2px);width:calc(${w}% - 5px);${style}">
      <span class="tb-h"><b>${e.start}–${e.end}</b>
        <span class="tb-who">${ids.map(i=>`<i style="background:${pal(i).c};box-shadow:0 0 0 1px ${pal(i).ci}55"></i>`).join('')}</span></span>
      <span class="tb-t">${okMark(j)}${leadText(j)?leadText(j)+' · ':''}${esc(j.title||'งาน')}${j.kind==='pend'?' (รออนุมัติ)':j.kind==='tbc'?' (TBC — ล็อกไว้ก่อน)':''}</span>
      <span class="tb-n">${ids.map(i=>byId(i).nick).join(', ')}</span></button>`;
  }).join('');
  const adBar=allDay.length?`<div class="tl-allday">
    <span class="adlbl">ทั้งวัน</span>
    <div class="adlist">${allDay.map(e=>{const ids=e.who.length?e.who:[e.anchor.cid];
      return `<button class="adchip" data-job="${k}|${e.key}"
        style="${jobStyle({...e.job,attendees:ids},ids[0])}">
        <b>${okMark(e.job)}${leadText(e.job)?leadText(e.job)+' · ':''}${esc(e.job.title||'งาน')}</b>
        <span>${ids.map(i=>byId(i).nick).join(', ')}</span></button>`;}).join('')}</div></div>`:'';
  return adBar+`<div class="tl" style="height:${H}px">
    <div class="tl-hours">${hours.map(h=>`<div class="tl-h" style="height:${rowH}px"><span>${String(h).padStart(2,'0')}:00</span></div>`).join('')}</div>
    <div class="tl-body">${hours.map(()=>`<div class="tl-line" style="height:${rowH}px"></div>`).join('')}
      ${blocks||'<div class="tl-empty">ไม่มีงานในวันนี้</div>'}</div></div>`;
}

  B.querySelectorAll('.slot.free:not([disabled])').forEach(b=>b.onclick=()=>{

function dayAnon(k){
  const total=teamPool().length;
  const hol=holidayOf(k);
  return ['am','pm'].map(slot=>{
    const blocked=maDay(k)||teamPool().some(c=>eventFor(k,c.id,slot));
    const free=freeIds(k,slot).length,picked=state.picks.some(p=>p.date===k&&p.slot===slot);
    /* วันหยุดใช้รูปแบบเดียวกับเสาร์–อาทิตย์: ขอคิวได้ แต่ไม่โชว์จำนวนคิวว่าง */
    const wknd=isWeekend(parse(k))||!!hol;
    return `<div class="qcard" ${picked?'style="box-shadow:inset 0 0 0 3px var(--ok)"':''}>
      <div class="qtop"><div><span class="qlbl">${slot==='am'?'MORNING':'AFTERNOON'}</span>
        <span class="qtime">${(w=>`${w.start} – ${w.end}`)(slotWindow(k,slot))}</span>
        ${(()=>{const w=teamPool().filter(c=>slotStatus(k,c.id,slot)==='free'&&isCustom(k,c.id,slot))
            .map(c=>fmtT(slotTime(k,c.id,slot)));
          return w.length?`<span class="muted" style="display:block;font-size:11.5px">บางคิวว่างเฉพาะ ${[...new Set(w)].join(', ')}</span>`:'';})()}</div>
        <div class="qcount ${free?'':'zero'}">${wknd
          ?`<b style="font-size:13px">${hol?esc(hol.name):'เสาร์–อาทิตย์'}</b>`
          :`<b>${blocked?'—':free}</b><small>${blocked?'MA EVENT':'คิวว่าง / '+total}</small>`}</div></div>
      ${wknd?'':`<div class="qbar"><i style="width:${blocked?0:Math.round(free/total*100)}%"></i></div>`}
      <button class="btn ${picked?'ok':'primary'} block" ${(!free||blocked)?'disabled':''} data-anon="${slot}">
        ${blocked?'ติดงานกลาง MA':gateBlocked()?'เลือก Product ก่อน':!free?'คิวเต็ม':picked?'✓ เลือกแล้ว — แตะเพื่อยกเลิก':'จองช่วงนี้'}</button></div>`;
  }).join('');
}
function dayNamed(k){

      const picked=state.picks.some(p=>p.date===k&&p.slot===slot&&p.ctsId===c.id);
      const t=slotTime(k,c.id,slot);
      const txt={free:'✅ ว่าง',busy:'ติดงาน',pend:'รออนุมัติ',booked:'มีเทรน',tbc:'TBC',closed:'ปิดรับคิว',notime:'เวลาไม่พอ',event:ev?ev.type:'งานกลาง'}[s];
      const sub=s==='closed'?'CTS ปิดรับคิวช่วงนี้เอง — กด 🕑 เพื่อเปิดใหม่':s==='event'?esc(ev.title):s==='notime'?`ต่อจากคิวก่อนหน้า เผื่อพัก+เดินทาง ${AUTO_RULE.bufferMin/60} ชม.`
        :(j.title?(leadText(j)?leadText(j)+' · ':'')+esc(j.title):'');
      const clickable=s==='free'||s==='busy'||s==='pend'||s==='booked'||s==='tbc';
      /* คิวที่ทับช่วงนี้ (ตามเวลาจริง) — ใช้เปิดรายละเอียดคิว */
      const en=entriesOf(k,c.id).find(x=>toMin(x.start)<toMin(SLOT_DEF[slot].end)&&toMin(x.end)>toMin(SLOT_DEF[slot].start));

      return `<button class="slot ${slot} ${s}${picked?' picked':''}" ${clickable?'':'disabled'}

        <span class="st">${picked?'✓ เลือกแล้ว':txt}</span>${sub?`<span class="sd">${sub}</span>`:''}</button>`;};
    return `<div class="cts-row" style="--c:${pal(c.id).c}">
      <div class="row">${face(c.id,'m')}<div class="grow"><div class="cts-name">${c.nick}<em>${c.name}</em></div></div>

      <div class="slots">${cell('am')}${cell('pm')}</div></div>`;}).join('');
}

  const B=$('sheetBody');
  const grab=()=>{E.title=$('evT').value;E.date=$('evD').value;E.slot=$('evS').value;E.type=$('evTy').value;
    const d2=$('evD2');if(d2)E.date2=d2.value;};
  B.querySelectorAll('[data-evall]').forEach(b=>b.onclick=()=>{grab();E.cts='all';openEventForm(editId,E);});
  B.querySelectorAll('[data-evteam]').forEach(b=>b.onclick=()=>{grab();E.cts=teamCTS(b.dataset.evteam).map(x=>x.id);openEventForm(editId,E);});
  B.querySelectorAll('[data-evc]').forEach(b=>b.onclick=()=>{grab();
    const id=b.dataset.evc;
    if(E.cts==='all')E.cts=CTS.map(c=>c.id);
    const i=E.cts.indexOf(id);i>=0?E.cts.splice(i,1):E.cts.push(id);
    openEventForm(editId,E);});
  const del=$('evDel');if(del)del.onclick=()=>{state.events=state.events.filter(x=>x.id!==editId);
    closeSheet();render();toast('ลบงานกลางแล้ว');};
  $('evSave').onclick=()=>{
    grab();
    const t=E.title.trim(),d=E.date;
    if(!t||!d)return toast('ใส่ชื่องานและวันที่');
    if(E.cts!=='all'&&!E.cts.length)return toast('เลือก CTS อย่างน้อย 1 คน หรือกด "ทุกคน"');
    /* ลงได้ทีละหลายวัน — ใส่ "ถึงวันที่" แล้วสร้างให้ทุกวันในช่วง · ตอนแก้ไขยังเป็นวันเดียวเหมือนเดิม */
    const stop=(!ev&&E.date2&&E.date2>d)?E.date2:d,days=[];
    for(let x=parse(d);key(x)<=stop;x.setDate(x.getDate()+1))days.push(key(x));
    if(!ev&&E.type==='วันหยุด'){
      days.forEach(dd=>{if(!state.holidays.some(h=>h.date===dd))state.holidays.push({date:dd,name:t});});
      state.month=new Date(parse(d).getFullYear(),parse(d).getMonth(),1);
      state.weekStart=mondayOf(parse(d));
      closeSheet();state.tab='cal';render();return toast(`เพิ่มวันหยุดแล้ว ${days.length} วัน`);}
    if(ev)Object.assign(ev,{date:d,slot:E.slot,type:E.type,title:t,cts:E.cts});
    else days.forEach(dd=>state.events.push({id:newId('EV',state.evSeq++),date:dd,slot:E.slot,type:E.type,title:t,cts:E.cts}));
    state.month=new Date(parse(d).getFullYear(),parse(d).getMonth(),1);
    state.weekStart=mondayOf(parse(d));
    closeSheet();state.tab='cal';render();toast(ev?'บันทึกงานกลางแล้ว':`เพิ่มงานกลางแล้ว ${days.length} วัน`);};
}

const newDraft=()=>({module:null,level:'',slots:1,sessions:null,product:[],topic:'',clinic:'',map:'',doctors:'',

/* 5 หัวข้อนี้ต้องกรอกก่อนส่งคำขอได้ (ติดดาวในฟอร์ม) — ที่เหลือกรอกตามหลังได้เหมือนเดิม */
const REQUIRED=[
  {k:'product', label:'Product', ok:r=>prodList(r.product).length},
  {k:'topic',   label:'หัวข้อ / เงื่อนไขการเทรน', ok:r=>String(r.topic||'').trim()},
  {k:'clinic',  label:'ชื่อคลินิก', ok:r=>String(r.clinic||'').trim()},
  {k:'doctors', label:'จำนวนแพทย์ที่เข้าเทรน', ok:r=>+r.doctors>0},
  {k:'requester',label:'ชื่อผู้ขอ', ok:r=>String(r.requester||'').trim()},
];
const missingRequired=r=>REQUIRED.filter(x=>!x.ok(r)).map(x=>x.label);
function missingOf(r){
  if(r.mode==='upc')return upcMissing(r);
  const m=[];
  if(!prodList(r.product).length)m.push('Product');
  if(r.sessions&&r.sessions.length>1)r.sessions.forEach((sn,i)=>{if(!sn.sProduct&&!r.product)m.push(`S${i+1}: Product`);});
  if(!r.level)m.push('ระดับเนื้อหา (Standard / Advance)');
  if(!String(r.topic||'').trim())m.push('หัวข้อการเทรน');
  if(!String(r.clinic||'').trim())m.push('ชื่อคลินิก');
  if(!String(r.map||'').trim())m.push('ลิงก์ Google Map');
  if(!(+r.doctors>0))m.push('จำนวนแพทย์');
  if(!r.exp)m.push('ประสบการณ์และ hands skills');
  if(!String(r.requester||'').trim())m.push('ชื่อผู้ขอ');
  if(r.handsOn){
    if(!String(r.hoProduct||'').trim())m.push('Product ที่ support (hands-on)');
    if(!(+r.hoCases>0))m.push('จำนวนเคส hands-on');
    if(!r.photos.length)m.push('รูปเคสก่อนเทรน');
  }
  return m;
}

/* ================= คำขอแบบ UPC (หลายวัน หลายคลินิกต่อวัน) ================= */
const newItem=()=>({province:'',clinic:'',map:'',module:'',level:'',product:'',topic:'',doctors:'',exp:'',
  handsOn:false,hoProduct:'',hoCases:'',photos:[],start:'09:00',end:'16:30'});
function dateRange(a,b){
  const out=[];if(!a||!b)return out;
  let d=parse(a),e=parse(b),guard=0;
  while(d<=e&&guard++<45){out.push(key(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);}
  return out;
}
function upcMissing(r){
  const m=[];
  if(!(r.days||[]).length)m.push('ยังไม่ได้เลือกช่วงวันที่');
  (r.days||[]).forEach(d=>{
    if(!d.items.length){m.push(`${fmtDate(d.date)}: ยังไม่มีรายการเทรน`);return;}
    d.items.forEach((it,i)=>{
      const lbl=`${fmtDate(d.date)} · รายการ ${i+1}`,miss=[];
      if(!it.province.trim())miss.push('จังหวัด');
      if(!it.clinic.trim())miss.push('ชื่อคลินิก');
      if(!it.map.trim())miss.push('Google Map');
      if(!it.product)miss.push('Product');
      if(!it.module)miss.push('Module');
      if(!it.level)miss.push('ระดับเนื้อหา');
      if(!it.topic.trim())miss.push('หัวข้อ');
      if(!(+it.doctors>0))miss.push('จำนวนแพทย์');
      if(!it.exp)miss.push('ประสบการณ์');
      if(it.handsOn){if(!it.hoProduct.trim())miss.push('product hands-on');
        if(!(+it.hoCases>0))miss.push('จำนวนเคส');if(!(it.photos||[]).length)miss.push('รูปเคส');}
      if(miss.length)m.push(`${lbl}: ${miss.join(', ')}`);
    });
  });
  if(!String(r.requester||'').trim())m.push('ชื่อผู้ขอ');
  return m;
}

function upcDayLabel(d){
  const it=(d.items||[])[0]||{};
  return `${esc(it.clinic||'ยังไม่ระบุคลินิก')}${d.items.length>1?` +${d.items.length-1}`:''}`;
}
function bookUPC(req){
  /* ทริปเดียวกันพยายามใช้ CTS คนเดียวทั้งทริปก่อน ถ้าไม่มีใครว่างครบค่อยจัดรายวัน */
  if(req.sessions.some(sn=>!sn.ctsId)){
    const allFree=CTS.find(c=>req.sessions.every(sn=>
      sn.ctsId===c.id||(slotStatus(sn.date,c.id,'am')==='free'&&slotStatus(sn.date,c.id,'pm')==='free')));
    if(allFree)req.sessions.forEach(sn=>{if(!sn.ctsId)sn.ctsId=allFree.id;});
  }
  req.sessions.forEach(sn=>{
    if(!sn.ctsId){const f=CTS.find(c=>slotStatus(sn.date,c.id,'am')==='free'&&slotStatus(sn.date,c.id,'pm')==='free');
      if(f)sn.ctsId=f.id;}
    if(sn.ctsId){
      const d=req.days.find(x=>x.date===sn.date)||{items:[]};
      const it=(d.items||[])[0]||{};
      const job={kind:req.status==='approved'?'booked':'pend',title:upcDayLabel(d).replace(/&amp;/g,'&'),
        product:it.product||null,reqId:req.id,start:it.start||'09:00',end:it.end||'16:30'};
      setJob(sn.date,sn.ctsId,'am',{...job});
      setJob(sn.date,sn.ctsId,'pm',{...job});
    }
  });
}
function clearUPC(req){req.sessions.forEach(sn=>{if(sn.ctsId){setJob(sn.date,sn.ctsId,'am',null);setJob(sn.date,sn.ctsId,'pm',null);}});}

function submitUPC(D){
  const req={id:newId('TR',state.seq++),team:'BOTH',area:'UPC',mode:'upc',status:'pending',created:new Date(),
    dateFrom:D.from,dateTo:D.to,days:JSON.parse(JSON.stringify(D.days.map(d=>({...d,items:d.items.map(i=>({...i,photos:[]}))})))),
    requester:D.requester,requesterId:state.role==='sales'?state.salesId:(state.me||'admin'),
    sessions:D.days.map(d=>({date:d.date,slot:'day',ctsId:null,fullDay:true})),
    module:'UPC Trip',level:'',product:null,clinic:'',map:'',topic:'',doctors:'',exp:'',
    handsOn:false,hoProduct:'',hoCases:'',photos:[]};
  D.days.forEach((d,di)=>d.items.forEach((it,ii)=>{req.days[di].items[ii].photos=it.photos||[];}));
  bookUPC(req);
  state.requests.unshift(req);notify(req,'pending');
  state.upcDraft=null;closeSheet();goTab('req');
  const m=upcMissing(req).length;
  toast(m?`ส่งคำขอ UPC แล้ว (${req.days.length} วัน) — ยังขาด ${m} รายการ`:`ส่งคำขอ UPC แล้ว (${req.days.length} วัน) รอ PAM/MILK อนุมัติ`);
}
function saveUPC(r,D){
  clearUPC(r);
  r.dateFrom=D.from;r.dateTo=D.to;
  r.days=D.days.map(d=>({date:d.date,items:d.items.map(i=>({...i}))}));
  r.requester=D.requester;
  const old={};r.sessions.forEach(sn=>old[sn.date]=sn.ctsId);
  r.sessions=D.days.map(d=>({date:d.date,slot:'day',ctsId:old[d.date]||null,fullDay:true}));
  bookUPC(r);
  if(r.status==='approved')r.missingAtApproval=upcMissing(r);
  r.updatedAt=new Date();
  state.upcDraft=null;closeSheet();render();
  const m=upcMissing(r).length;
  toast(m?`บันทึกแล้ว — ยังขาดอีก ${m} รายการ`:'บันทึกแล้ว — ข้อมูลครบถ้วน');
}

/* ===== คิว TBC : ล็อกวันไว้ก่อนรอคอนเฟิร์มแพทย์/คลินิก =====
   Sales เลือกได้หลายวัน -> ล็อกไว้ -> หัวหน้า (PAM/MILK) กด Confirm ว่าคิวและเนื้อหาถูกต้อง
   -> Sales กลับมากด "Confirm and Request" เพื่อเปลี่ยนเป็นคำขอปกติ
   ครบ 3 วันนับจากวันที่ส่ง TBC แล้วยังไม่ได้เปลี่ยน -> ปล่อยวันคืนระบบอัตโนมัติ */
const TBC_DAYS=3;
const tbcDeadline=r=>new Date(new Date(r.tbcAt).getTime()+TBC_DAYS*864e5);
const tbcLeft=r=>Math.ceil((tbcDeadline(r)-Date.now())/864e5);
function releaseTBC(r){r.sessions.forEach(sn=>{if(sn.ctsId)setJob(sn.date,sn.ctsId,sn.slot,null);});}
/* ปล่อยคิว TBC ที่หมดอายุ — เรียกตอนโหลดข้อมูลและทุกครั้งที่เรนเดอร์ ไม่ต้องพึ่ง cron ฝั่งเซิร์ฟเวอร์ */
function sweepTBC(){
  let n=0;
  state.requests.filter(r=>r.status==='tbc'&&r.tbcAt&&tbcDeadline(r)<=Date.now()).forEach(r=>{
    releaseTBC(r);r.status='expired';r.note='คิว TBC หมดอายุ '+TBC_DAYS+' วัน — ปล่อยวันคืนระบบแล้ว';n++;});
  return n;
}
/* หัวหน้ากดตรวจคิว TBC — เปลี่ยน CTS ได้ทีละวัน แล้วส่งกลับ (ใช้หน้าจอเดียวกับจัด CTS) */
function confirmTBC(id){
  const r=state.requests.find(x=>x.id===id);
  if(!r||!canApprove(r))return;
  assign(id);
}
/* Sales เลือกวันจริงจากวันที่ล็อกไว้ แล้วส่งเป็นคำขอปกติ วันที่เหลือถูกปล่อยคืน */
function convertTBC(id){
  const r=state.requests.find(x=>x.id===id);
  if(!r)return;
  /* ต้องรอหัวหน้า (PAM / MILK) ตรวจคิว TBC ก่อน ถึงจะเลือกวันจริงได้ */
  if(!r.tbcOk)return toast('รอ '+leadsOf(r.team).map(l=>l.nick).join(' / ')+' ตรวจคิว TBC ก่อน');
  const need=(MODULES[r.module]||{def:1}).def;
  const D={pick:r.sessions.map((_,i)=>i).slice(0,need)};
  const draw=()=>{
    openSheet(`<div class="eyebrow">${r.id} · TBC</div><h2>ยืนยันวันที่จะเทรนจริง</h2>
      <div class="muted" style="padding:6px 0 2px">เลือก ${need} วันจากที่ล็อกไว้ ${r.sessions.length} วัน — วันที่ไม่ได้เลือกจะถูกปล่อยคืนระบบ</div>`,
    `<div class="card">${r.sessions.map((sn,i)=>`<button class="chip" data-tp="${i}" aria-pressed="${D.pick.includes(i)}"
        style="display:block;width:100%;text-align:left;margin-bottom:7px">
        ${fmtDate(sn.date)} · ${sn.slot==='am'?'เช้า':'บ่าย'} ${sn.start||''}${sn.start?'–'+sn.end:''}${sn.ctsId?' · '+byId(sn.ctsId).nick:''}</button>`).join('')}
      <div class="err" id="tbcErr" hidden></div>
      <button class="btn primary block" id="tbcGo" style="margin-top:12px">Confirm and Request</button>
      <button class="btn ghost block" id="tbcNo" style="margin-top:8px">ยกเลิก</button></div>`);
    const B=$('sheetBody');
    B.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.tp,ix=D.pick.indexOf(i);ix>=0?D.pick.splice(ix,1):D.pick.push(i);draw();});
    $('tbcNo').onclick=closeSheet;
    $('tbcGo').onclick=()=>{
      const e=$('tbcErr');
      if(D.pick.length!==need){e.hidden=false;e.textContent=`ต้องเลือก ${need} วัน (ตอนนี้เลือก ${D.pick.length})`;return;}
      r.sessions.forEach((sn,i)=>{if(!D.pick.includes(i)&&sn.ctsId)setJob(sn.date,sn.ctsId,sn.slot,null);});
      r.sessions=D.pick.sort((a,b)=>a-b).map(i=>r.sessions[i]);
      r.sessions.forEach(sn=>{if(sn.ctsId)setJob(sn.date,sn.ctsId,sn.slot,
        {kind:'pend',title:r.clinic||'คำขอ '+r.id,product:prodMain(r.product),reqId:r.id,
         start:sn.start||SLOT_DEF[sn.slot].start,end:sn.end||SLOT_DEF[sn.slot].end});});
      r.status='pending';r.tbc=false;r.note='เปลี่ยนจากคิว TBC เป็นคำขอแล้ว';r.created=new Date();
      notify(r,'pending');closeSheet();render();
      toast('ส่งคำขอแล้ว — รอ '+leadsOf(r.team).map(l=>l.nick).join(' / ')+' อนุมัติ');};
  };
  draw();
}
