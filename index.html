function submit(){
  window.__grab&&window.__grab();
  const d=state.draft,e=[];
  if(!d.module)e.push('เลือก Module Training');
  missingRequired(d).forEach(x=>e.push('กรอก '+x));
  if(state.picks.length!==d.slots)e.push(`เลือกวันให้ครบ ${d.slots} slot`);
  state.picks.forEach((p,i)=>{
    if(p.start&&p.end&&p.end<=p.start)e.push(`S${i+1}: เวลาสิ้นสุดต้องหลังเวลาเริ่ม`);
    if(p.ctsId&&p.start){const w=slotTime(p.date,p.ctsId,p.slot);
      if(w.auto&&toMin(p.start)<toMin(w.start))
        e.push(`S${i+1}: เริ่มได้ไม่ก่อน ${w.start} น. (เผื่อพัก+เดินทางจากคิวก่อนหน้า ${AUTO_RULE.bufferMin/60} ชม.)`);}
  });
  const box=$('errBox');
  if(e.length){box.hidden=false;box.textContent='ยังส่งไม่ได้: '+e.join(' · ');box.scrollIntoView({block:'center'});return;}

  const team=activeTeam();
  const req={id:newId('TR',state.seq++),team,area:state.role==='sales'?state.area:TEAMS[team].areas[0],
    status:'pending',created:new Date(),sessions:state.picks.map(p=>({...p})),
    module:d.module,level:d.level,product:d.product,topic:d.topic,clinic:d.clinic,map:d.map,
    doctors:d.doctors,exp:d.exp,handsOn:d.handsOn,hoProduct:d.hoProduct,hoCases:d.hoCases,photos:d.photos,
    requester:d.requester,requesterId:state.role==='sales'?state.salesId:(state.me||'admin'),byRole:state.role};
  // anonymous picks (Sales) get a tentative CTS so the slot is truly held; the Leader can change it
  req.sessions.forEach(s=>{
    /* จัดคนชั่วคราวให้คิวถูกล็อกจริง — ต้องผ่าน freeIds() เพื่อไม่ให้ไปโดน Senior Leader
       หรือคนที่ยังไม่เปิด Skills ของ product ที่ขอ (หัวหน้าเปลี่ยนตัวได้ทีหลัง) */
    if(!s.ctsId){const f=freeIds(s.date,s.slot)[0];if(f)s.ctsId=f;}
    if(s.ctsId)setJob(s.date,s.ctsId,s.slot,{kind:'pend',title:req.clinic||'คำขอใหม่',product:s.sProduct||req.product,reqId:req.id,
      start:s.start||SLOT_DEF[s.slot].start,end:s.end||SLOT_DEF[s.slot].end});
  });
  state.requests.unshift(req);notify(req,'pending');
  state.draft=null;state.picks=[];closeSheet();goTab('req');
  const miss=missingOf(req).length;
  toast(miss?`ส่งคำขอแล้ว — ยังขาด ${miss} ข้อมูล ส่งตามได้`
    :'ส่งคำขอแล้ว — รอ '+leadsOf(team).map(l=>l.nick).join(' / ')+' อนุมัติ');
}

const gapv=()=>'<span class="gapv">— ยังไม่ได้กรอก</span>';
function missBox(r){
  const m=missingOf(r);if(!m.length)return '';
  const head=r.status==='approved'?'อนุมัติแล้ว แต่ยังต้องส่งข้อมูลเพิ่ม':'ข้อมูลที่ยังขาด — ส่งตามได้';
  return `<div class="warn"><b>${head} (${m.length})</b><br>${m.map(x=>'• '+x).join('<br>')}</div>`;
}
function reqCard(r,act){
  if(r.mode==='upc')return upcCard(r,act);
  const showCts=canSeeNames()||r.status==='approved';
  return `<div class="req"><div class="req-strip" style="--pc:${prodMain(r.product)?PRODHEX[prodMain(r.product)]:'#DDD'}"></div><div class="req-in">
    <div class="req-top"><div><div class="req-id">${r.id} · ${r.area} · ${TEAMS[r.team].label}</div>
      <div class="req-clinic">${r.clinic?esc(r.clinic):'<span style="color:var(--ink3)">ยังไม่ระบุคลินิก</span>'}</div></div>
      <span class="status ${r.status}">${r.status}</span></div>
    <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">
      ${prodList(r.product).length?prodTags(r.product):'<span class="pill miss">ยังไม่ระบุ product</span>'}
      <span class="pill n">${r.module} · ${r.sessions.length} session</span>
      ${r.level?`<span class="pill n">${r.level}</span>`:''}</div>
    <dl class="kv">
      <dt>หัวข้อ</dt><dd>${r.topic?esc(r.topic):gapv()}</dd>
      <dt>แพทย์</dt><dd>${+r.doctors>0?r.doctors+' ท่าน':gapv()}${r.exp?' · '+esc(r.exp.split('—')[0]):''}</dd>
      <dt>Hands-on</dt><dd>${r.handsOn?`${r.hoProduct?esc(r.hoProduct):gapv()} · ${r.hoCases||'?'} เคส · รูป ${r.photos.length}`:'ไม่มี'}</dd>
      <dt>สถานที่</dt><dd>${r.map?`<a href="${esc(r.map)}" target="_blank" rel="noopener">เปิด Google Map</a>`:gapv()}</dd>
      <dt>ผู้ขอ</dt><dd>${r.requester?esc(r.requester):gapv()}</dd></dl>
    <div class="sess">${r.sessions.map((s,i)=>`<div class="s" style="--c:${s.ctsId&&showCts?pal(s.ctsId).c:'#F6F5FA'};--ci:${s.ctsId&&showCts?pal(s.ctsId).ci:'var(--ink2)'}">
      <b>S${i+1}</b>${s.ctsId&&showCts?face(s.ctsId,'xs'):''}
      <span>${fmtDate(s.date)} · ${s.start||SLOT_DEF[s.slot].start}–${s.end||SLOT_DEF[s.slot].end}${s.ctsId&&showCts?' · <b style="font-family:var(--sans)">'+byId(s.ctsId).nick+'</b>':' · รอจัด CTS'}</span></div>`).join('')}</div>
    ${r.photos.length?`<div class="thumbs">${r.photos.map(p=>`<img src="${p.url}" alt="">`).join('')}</div>`:''}
    ${missBox(r)}
    ${r.status==='tbc'?`<div class="tbcbar"><b>⚠️ คิว TBC — ล็อกไว้ ${r.sessions.length} วัน · เหลืออีก ${Math.max(0,tbcLeft(r))} วัน ก่อนปล่อยวันคืนระบบ</b><br>
      ${r.tbcOk?'หัวหน้าตรวจแล้ว — อย่าลืมกด Confirm and Request เพื่อเลือกวันที่จะเอา'
        :'รอ '+leadsOf(r.team).map(l=>l.nick).join(' / ')+' ตรวจคิวก่อน ถึงจะกด Confirm and Request ได้'}</div>`:''}
    ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
    ${r.status==='tbc'&&(state.role==='sales'||state.role==='admin')?
      (r.tbcOk?`<button class="btn primary block" data-tbcgo="${r.id}" style="margin-top:10px">Confirm and Request</button>`
        :`<button class="btn block" disabled style="margin-top:10px">Confirm and Request · รอ ${leadsOf(r.team).map(l=>l.nick).join(' / ')} ตรวจคิวก่อน</button>`):''}
    ${r.status==='tbc'&&canApprove(r)?
      `<button class="btn block" data-tbcok="${r.id}" style="margin-top:8px">${
        r.tbcOk?'✎ แก้ CTS ของคิว TBC นี้':'✓ ตรวจคิว TBC · เปลี่ยน CTS รายวัน'}</button>`:''}
    <div class="row" style="margin-top:11px">
      <button class="btn grow" data-edit="${r.id}">✎ แก้ไข / เพิ่มข้อมูล</button>
      ${r.status==='approved'?`<button class="btn grow" data-copy="${r.id}">📋 คัดลอกสำหรับอีเมล</button>`:''}</div>
    ${act&&r.status!=='tbc'?`<div class="row" style="margin-top:12px"><button class="btn grow" data-assign="${r.id}">จัด / เปลี่ยน CTS</button>
      <button class="btn primary grow" data-approve="${r.id}">อนุมัติ</button></div>
      <button class="btn bad block" data-reject="${r.id}" style="margin-top:8px">ไม่อนุมัติ</button>`:''}
    ${state.role==='cts'?`<button class="btn bad block" data-del="${r.id}" style="margin-top:8px">🗑 ลบคำขอนี้</button>`:''}
  </div></div>`;
}

/* แก้ไข / เพิ่มข้อมูลของคำขอที่ส่งไปแล้ว — ทำได้ทั้งตอน pending และ approved
   (วันและ CTS แก้ผ่าน "จัด / เปลี่ยน CTS" ของ Senior Leader เท่านั้น) */
function openEdit(id){
  const r=state.requests.find(x=>x.id===id);
  const prodChips=PRODUCTS.map(pr=>`<button class="chip prodchip" data-ep="${pr}" style="--cc:${PRODHEX[pr]};--ct:${pink(pr)}" aria-pressed="${prodList(r.product).includes(pr)}">${pr}</button>`).join('');
  const miss=missingOf(r);
  openSheet(`<div class="eyebrow">${r.id} · ${r.status.toUpperCase()}</div><h2>แก้ไข / เพิ่มข้อมูล</h2>`,
  `${miss.length?`<div class="warn" style="margin-top:0"><b>ยังขาด ${miss.length} รายการ</b><br>${miss.map(x=>'• '+x).join('<br>')}</div>`:'<div class="note" style="margin-top:0">ข้อมูลครบแล้ว — แก้ไขเพิ่มเติมได้ตามต้องการ</div>'}
  <div class="card"><h3>Product และหัวข้อ</h3><div class="chips">${prodChips}</div>
    <label class="f">ระดับเนื้อหาการเทรน</label>
    <select class="in" id="eLevel"><option value="">— เลือกระดับ —</option>
      ${LEVELS.map(l=>`<option ${r.level===l?'selected':''}>${l}</option>`).join('')}</select>
    <label class="f">หัวข้อ / เงื่อนไขการเทรน <b class="req-star">*</b></label>
    <textarea class="in" id="eTopic" placeholder="เช่น ลงเครื่องใหม่ Xeomin all program">${esc(r.topic)}</textarea></div>

  <div class="card"><h3>ข้อมูลคลินิก</h3><div class="formgrid">
    <div class="full"><label class="f">ชื่อคลินิก <b class="req-star">*</b></label><input class="in" id="eClinic" value="${esc(r.clinic)}"></div>
    <div class="full"><label class="f">ลิงก์ Google Map</label><input class="in" id="eMap" value="${esc(r.map)}" placeholder="https://maps.app.goo.gl/..."></div>
    <div><label class="f">จำนวนแพทย์ <b class="req-star">*</b></label><input class="in" id="eDoc" type="number" min="1" value="${esc(r.doctors)}"></div>
    <div><label class="f">ประสบการณ์และ hands skills</label>
      <select class="in" id="eExp"><option value="">— เลือก —</option>${EXP.map(e=>`<option ${r.exp===e?'selected':''}>${e}</option>`).join('')}</select></div>
    </div></div>

  <div class="card"><h3>Hands-on</h3>
    <div class="row"><label class="grow" style="font-size:14px;font-weight:700">มีเคส hands-on</label>
      <input type="checkbox" id="eHO" ${r.handsOn?'checked':''} style="width:22px;height:22px"></div>
    <div ${r.handsOn?'':'hidden'}><div class="formgrid">
      <div><label class="f">Product ที่ support</label><input class="in" id="eHOP" value="${esc(r.hoProduct)}"></div>
      <div><label class="f">จำนวนเคส</label><input class="in" id="eHOC" type="number" min="1" value="${esc(r.hoCases)}"></div>
      <div class="full"><label class="f">รูปเคสก่อนเทรน <span>· เพิ่มทีหลังได้</span></label>
        <input type="file" id="ePhoto" accept="image/*" multiple>
        <div class="thumbs">${r.photos.map(ph=>`<img src="${ph.url}" alt="">`).join('')}</div></div></div></div></div>

  <div class="card"><h3>เวลาเทรนแต่ละ session</h3>
    ${r.sessions.map((sn,i)=>`<div class="picked-row" style="margin-bottom:12px">
      <div class="picked-item"><span class="idx">S${i+1}</span>${sn.ctsId?face(sn.ctsId,'xs'):''}
        <span class="grow">${sn.slot==='am'?'ช่วงเช้า':'ช่วงบ่าย'}${sn.ctsId?' · '+byId(sn.ctsId).nick:''}</span></div>
      <div class="timerow"><span class="tl">วันที่</span>
        <input class="in tin" type="date" lang="en-GB" id="es${i}d" value="${sn.date}" style="min-width:140px"></div>
      <div class="timerow"><span class="tl">เวลาเทรน</span>
        ${t24(`es${i}s`,sn.start||SLOT_DEF[sn.slot].start)}
        <span class="tl">ถึง</span>
        ${t24(`es${i}e`,sn.end||SLOT_DEF[sn.slot].end)}</div>
      ${r.sessions.length>1?`<div class="sdetail">
        <div class="chips">${PRODUCTS.map(pr=>`<button class="chip prodchip sm2" data-esp="${i}|${pr}"
          style="--cc:${PRODHEX[pr]};--ct:${pink(pr)}" aria-pressed="${sn.sProduct===pr}">${pr}</button>`).join('')}</div>
        <input class="in" id="es${i}t" value="${esc(sn.sTopic||'')}" placeholder="หัวข้อของ session นี้ (ถ้ามี)" style="margin-top:7px">
      </div>`:''}</div>`).join('')}
    <div class="muted">เปลี่ยนวันได้ที่นี่ · เปลี่ยนตัว CTS ที่ปุ่ม "จัด / เปลี่ยน CTS" ของ Senior Leader</div></div>

  <div class="card"><h3>ผู้ขอ</h3>
    <label class="f">ชื่อผู้ขอ</label><input class="in" id="eReq" value="${esc(r.requester)}">
    ${r.status==='approved'?'<div class="note">คำขอนี้อนุมัติแล้ว — บันทึกแล้วระบบจะอัปเดตสรุปและข้อความสำหรับอีเมลให้ใหม่</div>':''}
    <button class="btn primary block" id="eSave" style="margin-top:14px">บันทึกข้อมูล</button>
    <button class="btn ghost block" id="eCancel" style="margin-top:8px">ยกเลิก</button></div>`);

  const g=()=>{const v=i=>($(i)?$(i).value:'');
    r.level=v('eLevel');r.topic=v('eTopic');r.clinic=v('eClinic');r.map=v('eMap');
    r.doctors=v('eDoc');r.exp=v('eExp');r.hoProduct=v('eHOP');r.hoCases=v('eHOC');r.requester=v('eReq');
    r.sessions.forEach((sn,i)=>{const a=$('es'+i+'s'),b2=$('es'+i+'e'),dt=$('es'+i+'d'),tp=$('es'+i+'t');
      if(a&&a.value)sn.start=a.value; if(b2&&b2.value)sn.end=b2.value;
      if(tp)sn.sTopic=tp.value;
      if(dt&&dt.value&&dt.value!==sn.date)sn._newDate=dt.value;});};
  $('sheetBody').querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{g();const l=prodList(r.product),i=l.indexOf(b.dataset.ep);
    i>=0?l.splice(i,1):l.push(b.dataset.ep);r.product=l;openEdit(id);});
  $('sheetBody').querySelectorAll('[data-esp]').forEach(b=>b.onclick=()=>{g();const [i,pr]=b.dataset.esp.split('|');
    const sn=r.sessions[+i];sn.sProduct=sn.sProduct===pr?null:pr;openEdit(id);});
  $('eHO').onchange=e=>{g();r.handsOn=e.target.checked;openEdit(id);};
  const ph=$('ePhoto');if(ph)ph.onchange=e=>{g();[...e.target.files].forEach(f=>r.photos.push({name:f.name,url:URL.createObjectURL(f)}));openEdit(id);};
  $('eCancel').onclick=closeSheet;
  $('eSave').onclick=()=>{
    g();
    const left=missingOf(r);
    if(r.status==='approved'){
      r.missingAtApproval=left;
      const i=state.feed.findIndex(f=>f.r===r&&f.kind==='approved');
      if(i>=0)state.feed[i].at=new Date(); else notify(r,'approved');
    }
    // keep the held slots labelled with the latest clinic name
    // ย้ายวันของ session ถ้ามีการแก้ไข
    let moveErr=0;
    r.sessions.forEach(sn=>{
      if(!sn._newDate)return;
      const nd=sn._newDate;delete sn._newDate;
      if(!sn.ctsId){sn.date=nd;return;}
      if(holidayOf(nd)||!isWorkday(parse(nd))||slotStatus(nd,sn.ctsId,sn.slot)!=='free'){moveErr++;return;}
      reqWho(sn).forEach(id=>setJob(sn.date,id,sn.slot,null));   // ย้ายวัน ต้องล้างคิวเดิมของทุกคนที่ไปงานนี้
      sn.date=nd;
    });
    r.sessions.forEach(sn=>{if(sn.ctsId)syncReqJob(r,sn);});
    if(moveErr)toast(`ย้ายวันไม่ได้ ${moveErr} session — วันนั้นไม่ว่างหรือเป็นวันหยุด`);
    r.updatedAt=new Date();
    closeSheet();render();
    toast(left.length?`บันทึกแล้ว — ยังขาดอีก ${left.length} รายการ`:'บันทึกแล้ว — ข้อมูลครบถ้วน');
  };
}

function upcCard(r,act){
  const showCts=canSeeNames()||r.status==='approved';
  const days=(r.days||[]).map(d=>{
    const sn=(r.sessions||[]).find(x=>x.date===d.date)||{};
    return `<div class="upcday">
      <div class="upcday-h"><b>${fmtDate(d.date)}</b>
        ${sn.ctsId&&showCts?`<span class="s" style="background:${pal(sn.ctsId).c};color:${pal(sn.ctsId).ci}">
          ${face(sn.ctsId,'xs')} ${byId(sn.ctsId).nick}</span>`:'<span class="muted">รอจัด CTS</span>'}</div>
      ${(d.items||[]).map((it,i)=>`<div class="upcline">
        <span class="tm">${it.start||'—'}–${it.end||'—'}</span>
        ${it.product?`<span class="tag" style="background:${PRODHEX[it.product]};color:${pink(it.product)}">${it.product}</span>`:'<span class="pill miss">no product</span>'}
        <span class="grow">${esc(it.clinic||'ยังไม่ระบุคลินิก')}<br>
          <span class="muted">${esc(it.province||'—')}${it.module?' · '+it.module:''}${it.doctors?' · แพทย์ '+it.doctors:''}</span></span></div>`).join('')
        ||'<div class="muted">ยังไม่มีรายการ</div>'}
    </div>`;}).join('');
  return `<div class="req"><div class="req-strip" style="--pc:linear-gradient(90deg,#FFD961,#FF9FC6,#7C9CEC,#8FE2FF)"></div><div class="req-in">
    <div class="req-top"><div><div class="req-id">${r.id} · UPC · ดูแลร่วม</div>
      <div class="req-clinic">ทริป ${r.days.length} วัน · ${fmtDate(r.dateFrom)} – ${fmtDate(r.dateTo)}</div></div>
      <span class="status ${r.status}">${r.status}</span></div>
    <div class="muted" style="margin-top:6px">ผู้ขอ ${esc(r.requester||'—')} · รวม ${r.days.reduce((n,d)=>n+d.items.length,0)} คลินิก</div>
    ${days}
    ${missBox(r)}
    ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
    <div class="row" style="margin-top:11px">
      <button class="btn grow" data-uedit="${r.id}">✎ แก้ไข / เพิ่มข้อมูล</button>
      ${r.status==='approved'?`<button class="btn grow" data-copy="${r.id}">📋 คัดลอกสำหรับอีเมล</button>`:''}</div>
    ${act?`<div class="row" style="margin-top:9px"><button class="btn grow" data-assign="${r.id}">จัด / เปลี่ยน CTS</button>
      <button class="btn primary grow" data-approve="${r.id}">อนุมัติ</button></div>
      <button class="btn bad block" data-reject="${r.id}" style="margin-top:8px">ไม่อนุมัติ</button>`:''}
    ${state.role==='cts'?`<button class="btn bad block" data-del="${r.id}" style="margin-top:8px">🗑 ลบคำขอนี้</button>`:''}
  </div></div>`;
}
/* คิวที่อนุมัติแล้วโดนยกเลิกทีหลัง — เอาออกจากปฏิทิน CTS แล้วคืนช่องให้ Sales จองใหม่
   เก็บคำขอไว้ (status=cancelled) ไม่ลบทิ้ง จะได้ยังตามประวัติได้ · ลบจริงใช้ "ลบคำขอนี้" */
function cancelReq(id){
  const r=state.requests.find(x=>x.id===id);
  if(!r)return;
  openSheet(`<div class="eyebrow">${r.id}</div><h2>คิวนี้ยกเลิก?</h2>`,
  `<div class="card"><div class="warn" style="margin-top:0"><b>${esc(r.clinic||r.module||r.id)}</b><br>
    ${r.sessions.length} session · คิวจะหายจากปฏิทิน CTS และกลับเป็นช่องว่างให้ Sales จองใหม่</div>
    <div class="note">คำขอยังอยู่ในระบบ สถานะจะเปลี่ยนเป็น cancelled</div>
    <button class="btn bad block" id="cxYes" style="margin-top:13px">ยืนยัน — คิวยกเลิก</button>
    <button class="btn ghost block" id="cxNo" style="margin-top:8px">ไม่ใช่ ปิดหน้านี้</button></div>`);
  $('cxNo').onclick=closeSheet;
  $('cxYes').onclick=()=>{
    r.status='cancelled';r.cancelledBy=whoAmI();r.cancelledAt=new Date().toISOString();
    if(r.mode==='upc')clearUPC(r);
    else r.sessions.forEach(s=>reqWho(s).forEach(cid=>setJob(s.date,cid,s.slot,null)));
    notify(r,'cancelled');
    closeSheet();render();toast('คิวยกเลิกแล้ว — ลบออกจากปฏิทิน CTS แล้ว');};
}
/* ลบคำขอทิ้ง — เฉพาะ CTS · ถามยืนยันก่อนเพราะกู้คืนไม่ได้ */
function delReq(id){
  const r=state.requests.find(x=>x.id===id);
  if(!r||state.role!=='cts')return;
  openSheet(`<div class="eyebrow">${r.id}</div><h2>ลบคำขอนี้?</h2>`,
  `<div class="card"><div class="warn" style="margin-top:0"><b>${esc(r.clinic||r.module||r.id)}</b><br>
    ${r.sessions.length} session · สถานะ ${r.status}<br>ลบแล้วกู้คืนไม่ได้ และคิวในปฏิทินจะถูกปล่อยว่าง</div>
    <button class="btn bad block" id="delYes" style="margin-top:13px">ลบคำขอ</button>
    <button class="btn ghost block" id="delNo" style="margin-top:8px">ยกเลิก</button></div>`);
  $('delNo').onclick=closeSheet;
  $('delYes').onclick=()=>{
    if(r.mode==='upc')clearUPC(r);
    else r.sessions.forEach(s=>reqWho(s).forEach(cid=>setJob(s.date,cid,s.slot,null)));
    state.requests=state.requests.filter(x=>x.id!==id);
    state.feed=state.feed.filter(f=>!f.r||f.r.id!==id);
    closeSheet();render();toast('ลบคำขอแล้ว');};
}
function bindCards(scope){
  scope.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approve(b.dataset.approve));
  scope.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>reject(b.dataset.reject));
  scope.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assign(b.dataset.assign));
  scope.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copySummary(b.dataset.copy));
  scope.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    const r=state.requests.find(x=>x.id===b.dataset.edit);
    if(r&&r.mode==='upc'){state.upcDraft=null;openUPCForm(r.id);}else openEdit(b.dataset.edit);});
  scope.querySelectorAll('[data-uedit]').forEach(b=>b.onclick=()=>{state.upcDraft=null;openUPCForm(b.dataset.uedit);});
  scope.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delReq(b.dataset.del));
  scope.querySelectorAll('[data-cancelreq]').forEach(b=>b.onclick=()=>cancelReq(b.dataset.cancelreq));
  scope.querySelectorAll('[data-tbcok]').forEach(b=>b.onclick=()=>confirmTBC(b.dataset.tbcok));
  scope.querySelectorAll('[data-tbcgo]').forEach(b=>b.onclick=()=>convertTBC(b.dataset.tbcgo));
}
/* ===== Admin: เปิด Skills ให้ CTS รายคน x ราย product =====

const SKILL_LABEL={self:'เปิด',senior:'+Senior'};
const SKILL_ICON={null:'○',self:'✓',senior:'★'};

/* สรุปคิวในปฏิทิน CTS แยกรายคน — ใครมีคิวของ product ไหนไปกี่คิว ในช่วงเวลาที่เลือก
   นับจากคิวที่ขึ้นในปฏิทินทั้งหมด (คิวจากคำขอ + คิวที่ CTS ลงเอง) · 1 คิวในปฏิทิน = 1 คิว
   คิวที่ไปหลายคนนับให้เจ้าของคิวคนเดียว คนที่ไปด้วยไม่นับ
   SKU ย่อยรวมเป็นตระกูลเดียว เช่น Belotero Revive -> Belotero */
const DASH_PRODUCTS=['Ultherapy','Belotero','Xeomin','Radiesse'];
function dashRange(){
  if(!state.dash){const m=state.month;
    state.dash={from:key(new Date(m.getFullYear(),m.getMonth(),1)),
                to:key(new Date(m.getFullYear(),m.getMonth()+1,0))};}
  return state.dash;
}
/* เจ้าของคิว = คนที่ลงคิวนั้น · คิวจากคำขอคือ CTS ที่หัวหน้าจัดให้ (who[0]) คนที่เพิ่มมาทีหลังไม่นับ
   คิวที่ CTS ลงเองคือคนลง (owner) — ถ้า Admin เป็นคนลงให้ ก็นับให้คนแรกในรายชื่อผู้ร่วมงาน */
const ownerOf=e=>(e.job.owner&&e.who.includes(e.job.owner))?e.job.owner:e.who[0];
function trainRows(){
  const R=dashRange(),out=[];
  if(!R.from||!R.to||R.to<R.from)return out;
  const pool=CTS.map(c=>c.id);   // อ่านทุกคน ไม่ขึ้นกับตัวกรองที่ตั้งไว้ในหน้าปฏิทิน
  dateRange(R.from,R.to).forEach(k=>{
    dayEntries(k,pool).filter(e=>e.job&&e.who.length).forEach(e=>{
      const fams=[...new Set(prodList(e.job.product).map(prodFamily).filter(p=>DASH_PRODUCTS.includes(p)))];
      out.push({cid:ownerOf(e),date:k,uid:k+'|'+e.key,fams});
    });
  });
  return out;
}
const DASH_PRESETS=[
  ['เดือนนี้',    ()=>{const d=new Date();return [new Date(d.getFullYear(),d.getMonth(),1),new Date(d.getFullYear(),d.getMonth()+1,0)];}],
  ['3 เดือนล่าสุด',()=>{const d=new Date();return [new Date(d.getFullYear(),d.getMonth()-2,1),new Date(d.getFullYear(),d.getMonth()+1,0)];}],
  ['ปีนี้',        ()=>{const d=new Date();return [new Date(d.getFullYear(),0,1),new Date(d.getFullYear(),11,31)];}],
];
function renderDash(){
  const R=dashRange(),rows=trainRows();
  const cts=CTS.filter(c=>rows.some(x=>x.cid===c.id));
  const cols=DASH_PRODUCTS;    // 4 ตระกูลเท่านั้น — SKU ย่อยถูกรวมมาแล้วตอนนับ
  /* ponytail: นับด้วยการวนซ้ำตรงๆ — ข้อมูลระดับหลักร้อยแถว ไม่ต้องทำ index
     ตัวเลขราย product = จำนวน "วัน" ที่มีคิวของตระกูลนั้น — วันเดียวกันหลาย SKU หรือหลายคิว นับเป็น 1
     คนละวันนับแยก เช่น Belotero 3 วันในเดือนนั้น = 3 */
  const days=list=>new Set(list.map(x=>x.cid+'|'+x.date)).size;
  const n=(cid,p)=>days(rows.filter(x=>x.cid===cid&&x.fams.includes(p)));
  const nAll=p=>days(rows.filter(x=>x.fams.includes(p)));
  const qOf=cid=>rows.filter(x=>x.cid===cid).length;
  const totQ=new Set(rows.map(x=>x.uid)).size;
  const top=cols.map(p=>[p,nAll(p)]).sort((a,b)=>b[1]-a[1])[0];

  /* การ์ดรายคน — รูป CTS + จำนวนคิวของแต่ละ product */
  const cards=cts.map(c=>`<div class="dcard" style="--c:${pal(c.id).c};--ci:${pal(c.id).ci}">
    <div class="dhead"><img src="${FACES[c.id]||''}" alt="">
      <span class="grow"><b>${c.nick}</b><em>${esc(c.name)} · ${TEAMS[c.team]?TEAMS[c.team].label:c.team}</em></span>
      <span class="dtot"><b>${qOf(c.id)}</b><small>คิว</small></span></div>
    <div class="dprods">${cols.map(p=>{const v=n(c.id,p);
      return `<span class="dp${v?' on':''}" style="--pc:${PRODHEX[p]||'#EEE'};--pi:${pink(p)}">
        <b>${v}</b><small>${esc(p)}</small></span>`;}).join('')}</div></div>`).join('');
  const totCard=`<div class="dcard sum">
    <div class="dhead"><span class="dic">Σ</span>
      <span class="grow"><b>รวมทุกคน</b><em>${cts.length} คน</em></span>
      <span class="dtot"><b>${totQ}</b><small>คิว</small></span></div>
    <div class="dprods">${cols.map(p=>`<span class="dp on" style="--pc:${PRODHEX[p]||'#EEE'};--pi:${pink(p)}">
      <b>${nAll(p)}</b><small>${esc(p)}</small></span>`).join('')}</div></div>`;

  setHTML(view(),`<h1 class="pt">Dashboard</h1>
    <p class="psub">สรุปคิวในปฏิทิน CTS แยกรายคน — ใครมีคิวของ Product ไหนไปกี่คิว</p>
    <div class="card">
      <div class="eyebrow">ช่วงเวลาที่ดู</div>
      <div class="chips" style="margin:9px 0 12px">
        ${DASH_PRESETS.map((p,i)=>`<button class="chip" data-dp="${i}">${p[0]}</button>`).join('')}</div>
      <div class="formgrid">
        <div><label class="f" style="margin-top:0">ตั้งแต่วันที่</label><input class="in" id="dFrom" type="date" lang="en-GB" value="${R.from}"></div>
        <div><label class="f" style="margin-top:0">ถึงวันที่</label><input class="in" id="dTo" type="date" lang="en-GB" value="${R.to}"></div>
      </div>
      <div class="muted" style="margin-top:10px">${fmtDate(R.from)} – ${fmtDate(R.to)}</div>
    </div>
    <div class="tiles">
      <div class="tile"><span class="tn">${totQ}</span><span class="tl">คิวในปฏิทิน</span></div>
      <div class="tile"><span class="tn">${cts.length}</span><span class="tl">CTS ที่มีคิว</span></div>
      <div class="tile"><span class="tn">${top?top[1]:0}</span><span class="tl">${top?esc(top[0]):'—'}<br><span class="muted" style="font-size:10.5px">Product ที่มีคิวมากสุด</span></span></div>
    </div>
    ${cts.length?`<div class="dgrid">${cards}${totCard}</div>
      <div class="muted" style="margin:0 0 14px">นับจากคิวที่ขึ้นในปฏิทิน CTS ทั้งหมด · คิวที่ไปหลายคนนับให้เจ้าของคิวคนเดียว คนที่ไปด้วยไม่นับ ·
        <b>ตัวเลขราย Product = จำนวนวันที่มีคิวของตระกูลนั้น</b> — SKU ย่อยรวมเป็นตระกูลเดียว (Belotero Revive / Soft / Balance → Belotero)
        วันเดียวกันมีหลาย SKU หรือหลายคิวของตระกูลเดียวกันนับเป็น 1 · คนละวันนับแยก เช่น มีคิว Belotero 3 วันในเดือนนั้น = 3 ·
        ตัวเลขมุมขวาบน = จำนวนคิวจริงในปฏิทิน จึงไม่เท่ากับผลรวมราย Product ได้</div>`
    :'<div class="card"><div class="empty"><div class="big">↗</div>ยังไม่มีคิวในปฏิทินช่วงนี้<br><span class="muted">ลองขยายช่วงเวลาที่เลือก</span></div></div>'}`);

  const set=(a,b)=>{state.dash={from:key(a),to:key(b)};renderDash();};
  view().querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>set(...DASH_PRESETS[+b.dataset.dp][1]()));
  $('dFrom').onchange=e=>{state.dash={...R,from:e.target.value};renderDash();};
  $('dTo').onchange=e=>{state.dash={...R,to:e.target.value};renderDash();};
}

function assign(id){
  const r=state.requests.find(x=>x.id===id);
  const isTbc=r.status==='tbc';   // คิว TBC: หัวหน้าเปลี่ยน CTS รายวันได้ แล้วกดส่งกลับว่าตรวจแล้ว
  const pool=BOOKABLE_CTS();   // จัดได้ทั้ง 6 คน — เลือกได้เฉพาะคนที่ว่างจริง (เช็คด้านล่าง)
  const rows=r.sessions.map((s,i)=>{
    const full=s.slot==='day';
    const prods=prodList(r.product);
    const opts=['<option value="">— เลือก CTS —</option>'].concat(pool.map(c=>{
      const same=c.id===s.ctsId;
      const free=full?(slotStatus(s.date,c.id,'am')==='free'&&slotStatus(s.date,c.id,'pm')==='free')
                     :slotStatus(s.date,c.id,s.slot)==='free';
      /* เปลี่ยนได้เฉพาะคนที่ว่างจริง + เปิด Skills ครบตาม product ที่ขอ
         ถ้าเป็น Train with Senior ต้องมี PAM/MILK ว่างในช่วงนั้นด้วย */
      const skilled=!prods.length||canTrain(c.id,prods);
      const srOk=!prods.length||!needsSenior(c.id,prods)||
        (full?seniorsFree(s.date,'am').length&&seniorsFree(s.date,'pm').length:seniorsFree(s.date,s.slot).length);
      const ok=same||(free&&skilled&&srOk);
      const why=ok?'':!free?' (ไม่ว่าง)':!skilled?' (ยังไม่เปิด Skills)':' (ต้องมี PAM/MILK ว่างด้วย)';
      return `<option value="${c.id}" ${same?'selected':''} ${ok?'':'disabled'}>${c.nick} — ${c.name}${why}</option>`;})).join('');
    return `<label class="f">${full?'':'S'+(i+1)+' · '}${fmtDate(s.date)}${full?' · ทั้งวัน':' · '+(s.slot==='am'?'เช้า':'บ่าย')}</label>
      <select class="in" data-sess="${i}">${opts}</select>`;}).join('');
  openSheet(`<div class="eyebrow">${r.id}${isTbc?' · TBC':''}</div><h2>${isTbc?'ตรวจคิว TBC · เปลี่ยน CTS รายวัน':'จัด CTS ผู้เทรน'}</h2>`,
    `<div class="card">${rows}<div class="note">เลือกได้เฉพาะคนที่ว่างจริง และเปิด Skills ของ product ที่ขอไว้แล้ว${
      isTbc?' · เปลี่ยนได้ทีละวัน แล้วกดส่งกลับให้ Sales':''}</div>
    <button class="btn primary block" id="saveRe" style="margin-top:14px">${isTbc?'✓ ตรวจคิว TBC แล้ว — ส่งกลับ':'บันทึก'}</button></div>`);
  $('saveRe').onclick=()=>{
    $('sheetBody').querySelectorAll('[data-sess]').forEach(sel=>{
      const s=r.sessions[+sel.dataset.sess],nid=sel.value||null;
      if(nid!==s.ctsId){
        if(s.slot==='day'){
          if(s.ctsId){setJob(s.date,s.ctsId,'am',null);setJob(s.date,s.ctsId,'pm',null);}
          s.ctsId=nid;
        }else{
          if(s.ctsId)setJob(s.date,s.ctsId,s.slot,null);
          if(nid)setJob(s.date,nid,s.slot,{kind:isTbc?'tbc':'pend',
            title:isTbc?'TBC · '+(r.clinic||r.id):(r.clinic||'คำขอ '+r.id),product:r.product,reqId:r.id,
            start:s.start||SLOT_DEF[s.slot].start,end:s.end||SLOT_DEF[s.slot].end});
          s.ctsId=nid;}}});
    r.sessions.forEach(stampNow);
    if(r.mode==='upc')bookUPC(r);
    if(isTbc){r.tbcOk=true;r.tbcOkBy=whoAmI();r.note='หัวหน้าตรวจคิว TBC แล้ว — รอ Sales ยืนยันวันจริง';
      closeSheet();render();toast('ตรวจคิว TBC แล้ว — แจ้ง Sales ให้มากด Confirm and Request');return;}
    r.note='Senior Leader จัดผู้เทรนแล้ว';closeSheet();render();toast('จัด CTS แล้ว');};
}
function approve(id){
  const r=state.requests.find(x=>x.id===id);
  if(r.status==='tbc')return toast('คิว TBC ยังอนุมัติไม่ได้ — รอ Sales กด "Confirm and Request" ก่อน');
  if(r.sessions.some(s=>!s.ctsId))return toast('ต้องจัด CTS ให้ครบทุก session ก่อนอนุมัติ');
  const m=missingOf(r);
  if(m.length&&!r._ack)return confirmMissing(r,m);
  r.sessions.forEach(stampNow);
  r.status='approved';r.approvedBy=(state.role==='cts'?byId(state.me).nick:'Admin');r.approvedAt=new Date();r.missingAtApproval=missingOf(r);
  if(r.mode==='upc')bookUPC(r);
  else r.sessions.forEach(s=>setJob(s.date,s.ctsId,s.slot,{kind:'booked',title:s.sProduct||r.clinic||'Training',
    product:s.sProduct||r.product,reqId:r.id,
    start:s.start||SLOT_DEF[s.slot].start,end:s.end||SLOT_DEF[s.slot].end}));
  notify(r,'approved');render();
  toast(r.missingAtApproval.length?'อนุมัติแล้ว — แจ้งขอข้อมูลเพิ่มแล้ว':'อนุมัติแล้ว — ลงคิวในปฏิทิน CTS แล้ว');
}
function confirmMissing(r,m){
  openSheet(`<div class="eyebrow">${r.id}</div><h2>ยังขาดข้อมูล ${m.length} รายการ</h2>`,
  `<div class="card"><div class="warn" style="margin-top:0"><b>คำขอนี้ยังกรอกไม่ครบ</b><br>${m.map(x=>'• '+x).join('<br>')}</div>
    <div class="note">อนุมัติได้เลย ระบบจะแนบรายการนี้ไปในข้อความแจ้งเตือน เพื่อขอให้ผู้ขอส่งข้อมูลตามมา</div>
    <button class="btn primary block" id="okMiss" style="margin-top:14px">อนุมัติ และขอข้อมูลเพิ่ม</button>
    <button class="btn ghost block" id="noMiss" style="margin-top:8px">ยังไม่อนุมัติ — รอข้อมูลก่อน</button></div>`);
  $('okMiss').onclick=()=>{r._ack=true;closeSheet();approve(r.id);};
  $('noMiss').onclick=closeSheet;
}
function reject(id){
  const r=state.requests.find(x=>x.id===id);r.status='rejected';
  if(r.mode==='upc')clearUPC(r);
  else r.sessions.forEach(s=>reqWho(s).forEach(cid=>setJob(s.date,cid,s.slot,null)));
  notify(r,'rejected');render();toast('ไม่อนุมัติ — คืนคิวให้ CTS แล้ว');
}

function emailText(r){
  if(r.mode==='upc')return upcEmail(r);
  const F=v=>(v===''||v===undefined||v===null)?'(รอยืนยัน / to be confirmed)':v;
  const L=[];
  L.push('TRAINING REQUEST — CONFIRMED');
  L.push(`Reference: ${r.id}   |   Merz Aesthetics Thailand — Clinical Training`);
  L.push('');
  L.push('CLINIC');
  L.push(`  • Clinic name    : ${F(r.clinic)}`);
  L.push(`  • Location       : ${F(r.map)}`);
  L.push(`  • PS Area / Team : ${r.area} / ${TEAMS[r.team].label}`);
  L.push(`  • Requested by   : ${F(r.requester)}`);
  L.push('');
  L.push('TRAINING SCOPE');
  L.push(`  • Module         : ${r.module} — ${r.sessions.length} session(s)`);
  L.push(`  • Content level  : ${F(r.level)}`);
  L.push(`  • Product        : ${F(prodList(r.product).join(', '))}`);
  L.push(`  • Topic          : ${F(r.topic)}`);
  L.push(`  • Attendees      : ${+r.doctors>0?r.doctors+' doctor(s)':'(รอยืนยัน / to be confirmed)'}`);
  L.push(`  • Experience     : ${F(r.exp)}`);
  L.push('');
  L.push('HANDS-ON');
  if(r.handsOn){
    L.push(`  • Product support: ${F(r.hoProduct)}`);
    L.push(`  • Cases          : ${r.hoCases||'(รอยืนยัน)'}`);
    L.push(`  • Pre-training photos: ${r.photos.length?r.photos.length+' file(s) attached':'(ยังไม่ได้แนบ / not yet attached)'}`);
  }else{
    L.push('  • Not required');
  }
  L.push('');
  L.push('SCHEDULE');
  r.sessions.forEach((s,i)=>{const c=byId(s.ctsId);
    L.push(`  • Session ${i+1} : ${fmtEN(s.date)}  |  ${s.start||SLOT_DEF[s.slot].start}–${s.end||SLOT_DEF[s.slot].end} (${s.slot.toUpperCase()})  |  ${c.nick} — ${c.name}`);});
  L.push('');
  L.push('APPROVAL');
  L.push(`  • Approved by    : ${r.approvedBy} — Senior Leader, ${TEAMS[r.team].label}`);
  L.push(`  • Approved at    : ${new Date(r.approvedAt).toLocaleString('en-GB')}`);
  L.push('  • Status         : CONFIRMED — added to CTS calendar');
  const miss=missingOf(r);
  if(miss.length){
    L.push('');
    L.push('OUTSTANDING INFORMATION — please send to Clinical Training');
    miss.forEach(x=>L.push(`  • ${x}`));
  }
  return L.join('\n');
}

function upcEmail(r){
  const F=v=>(v===''||v===undefined||v===null)?'(รอยืนยัน / to be confirmed)':v;
  const L=[];
  L.push('UPC TRAINING TRIP — '+(r.status==='approved'?'CONFIRMED':'PENDING APPROVAL'));
  L.push(`Reference: ${r.id}   |   Merz Aesthetics Thailand — Clinical Training`);
  L.push('');
  L.push('TRIP SUMMARY');
  L.push(`  • Period       : ${fmtEN(r.dateFrom)} – ${fmtEN(r.dateTo)}  (${r.days.length} day(s))`);
  L.push(`  • Clinics      : ${r.days.reduce((n,d)=>n+d.items.length,0)} site(s)`);
  L.push(`  • Requested by : ${F(r.requester)}  (UPC)`);
  if(r.approvedBy)L.push(`  • Approved by  : ${r.approvedBy} — Senior Leader`);
  L.push('');
  L.push('DAY-BY-DAY SCHEDULE');
  r.days.forEach(d=>{
    const sn=(r.sessions||[]).find(x=>x.date===d.date)||{};
    const c=sn.ctsId?byId(sn.ctsId):null;
    L.push('');
    L.push(`▍${fmtEN(d.date)}${c?`   —   Trainer: ${c.nick} (${c.name})`:'   —   Trainer: (to be assigned)'}`);
    if(!d.items.length){L.push('   • (no clinic entered yet)');return;}
    d.items.forEach((it,i)=>{
      L.push(`   ${i+1}. ${F(it.clinic)}  |  ${F(it.province)}  |  ${it.start||'--:--'}–${it.end||'--:--'}`);
      L.push(`      - Module   : ${F(it.module)}${it.level?' / '+it.level:''}`);
      L.push(`      - Product  : ${F(it.product)}`);
      L.push(`      - Topic    : ${F(it.topic)}`);
      L.push(`      - Attendees: ${+it.doctors>0?it.doctors+' doctor(s)':'(รอยืนยัน)'}${it.exp?' | '+it.exp:''}`);
      L.push(`      - Hands-on : ${it.handsOn?`${F(it.hoProduct)}, ${it.hoCases||'?'} case(s), ${(it.photos||[]).length} photo(s)`:'No'}`);
      L.push(`      - Location : ${F(it.map)}`);
    });
  });
  const miss=upcMissing(r);
  if(miss.length){L.push('');L.push('OUTSTANDING INFORMATION — please send to Clinical Training');
    miss.forEach(x=>L.push(`  • ${x}`));}
  return L.join('\n');
}
function copySummary(id){
  const r=state.requests.find(x=>x.id===id),txt=emailText(r);
  const done=()=>toast('คัดลอกแล้ว — วางในอีเมลได้เลย');
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('กดค้างที่กล่องข้อความเพื่อคัดลอก');}
  document.body.removeChild(ta);
}

function notify(r,kind){
  state.feed=state.feed.filter(f=>f.r.id!==r.id);
  state.feed.unshift({r,kind,at:new Date()});
}
const NKIND={
  pending :{ic:'🕒', label:'รออนุมัติ', bg:'var(--warn-soft)', bd:'var(--warn-edge)', ink:'#8A6C1B'},
  approved:{ic:'✓',  label:'อนุมัติแล้ว', bg:'var(--ok-soft)',  bd:'var(--ok-edge)',  ink:'var(--ok)'},
  rejected:{ic:'✕',  label:'ไม่อนุมัติ', bg:'var(--bad-soft)', bd:'var(--bad-edge)', ink:'var(--bad)'},
  cancelled:{ic:'✕', label:'คิวยกเลิก', bg:'var(--bad-soft)', bd:'var(--bad-edge)', ink:'var(--bad)'},
};
function notiCard(it){
  const r=it.r,K=NKIND[it.kind];
  const t=new Date(it.at).toLocaleString('th-TH',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  const when=r.mode==='upc'
    ? r.days.map(d=>`${fmtDate(d.date)} · ${(d.items||[]).map(i=>esc(i.clinic||'—')).join(', ')||'—'}`)
    : r.sessions.map(s=>`${fmtDate(s.date)} · ${s.start||SLOT_DEF[s.slot].start}–${s.end||SLOT_DEF[s.slot].end}${s.sProduct?' · '+s.sProduct:''}`);
  const head=`<div class="nhead2" style="background:${K.bg};border-bottom:1px solid ${K.bd};color:${K.ink}">
      <span class="nic">${K.ic}</span>
      <span class="grow"><b>${K.label}</b><small>${r.id} · ${r.area}${r.team==='BOTH'?' · ดูแลร่วม':''}</small></span>
      ${r.mode==='upc'?'<span class="pill n">UPC TRIP</span>'
        :prodList(r.product).length?prodTags(r.product):''}
    </div>`;
  const body=`<div class="nbody">
      <div class="nclinic">${r.mode==='upc'?`ทริป UPC ${r.days.length} วัน`:esc(r.clinic||'ยังไม่ระบุคลินิก')}</div>
      <div class="muted">${r.mode==='upc'
        ? `${fmtDate(r.dateFrom)} – ${fmtDate(r.dateTo)} · ${r.days.reduce((n,d)=>n+d.items.length,0)} คลินิก · ผู้ขอ ${esc(r.requester||'—')}`
        : `${r.module} · ${r.sessions.length} session${r.level?' · '+r.level:''} · ผู้ขอ ${esc(r.requester||'—')}`}</div>
      <div class="nwhen">${when.map(w=>`<span>${w}</span>`).join('')}</div>
      ${it.kind==='pending'
        ? `<div class="muted" style="margin-top:8px">รอ ${leadsOf(r.team).map(l=>l.nick).join(' หรือ ')} พิจารณา${r.team==='BOTH'?' (อนุมัติได้ทั้งสองคน)':''}</div>`
        : it.kind==='cancelled'
        ? `<div class="muted" style="margin-top:8px">ยกเลิกโดย ${esc(r.cancelledBy||'—')} — ลบออกจากปฏิทิน CTS แล้ว คิวว่างกลับคืนให้ Sales</div>`
        : it.kind==='rejected'
        ? `<div class="muted" style="margin-top:8px">คิวถูกคืนให้ CTS แล้ว — ติดต่อ Leader เพื่อจัดวันใหม่</div>`
        : `<div class="nsess">${r.sessions.filter(s=>s.ctsId).map((s,i)=>`<span class="s" style="background:${pal(s.ctsId).c};color:${pal(s.ctsId).ci}">
             ${face(s.ctsId,'xs')} ${r.mode==='upc'?fmtDate(s.date).split(' ').slice(1,3).join(' '):'S'+(i+1)} · ${byId(s.ctsId).nick}</span>`).join('')}</div>
           <div class="muted" style="margin-top:8px">อนุมัติโดย ${r.approvedBy} · ลงคิวในปฏิทินให้อัตโนมัติแล้ว</div>`}
      ${(r.missingAtApproval&&r.missingAtApproval.length)
        ? `<div class="warn"><b>⚠ รบกวนส่งข้อมูลเพิ่ม ${r.missingAtApproval.length} รายการ</b><br>${r.missingAtApproval.map(x=>'• '+x).join('<br>')}</div>`
        : (it.kind==='pending'&&missingOf(r).length)
        ? `<div class="warn"><b>ยังกรอกไม่ครบ ${missingOf(r).length} รายการ</b> — กด "แก้ไข" เพื่อเติมข้อมูล</div>`:''}
      <div class="row" style="margin-top:11px;flex-wrap:wrap">
        <button class="btn sm" data-${r.mode==='upc'?'uedit':'edit'}="${r.id}">✎ แก้ไข / เพิ่มข้อมูล</button>
        ${it.kind==='approved'?`<button class="btn sm" data-mail="${r.id}">✉ ข้อความสำหรับอีเมล</button>
          <button class="btn sm" data-copy="${r.id}">📋 คัดลอก</button>`:''}
        <span class="muted" style="margin-left:auto;font-family:var(--mono);font-size:10.5px">${t}</span></div>
      ${it.kind==='approved'?`<div class="copybox" id="mail_${r.id}" hidden>${esc(emailText(r))}</div>`:''}
    </div>`;
  return `<div class="ncard">${head}${body}</div>`;
}
function renderFeed(){
  markFeedSeen();   // เปิดแท็บนี้ = อ่านแล้ว ป้ายบนไอคอนแอปจะถูกล้าง
  const all=state.feed.filter(i=>canSeeReq(i.r));
  const noti=typeof Notification!=='undefined'&&Notification.permission!=='granted';
  const f=state.feedFilter||'all';
  const feed=f==='all'?all:all.filter(i=>i.kind===f);
  const n=k=>all.filter(i=>i.kind===k).length;
  const scope=state.role==='sales'?`เฉพาะคำขอของ ${state.salesId}`
    :state.role==='cts'?`${TEAMS[byId(state.me).team].label} และ UPC`:'ทุกทีม';
  setHTML(view(),`<h1 class="pt">แจ้งเตือน</h1>
    <p class="psub">1 คำขอ = 1 การ์ด อัปเดตสถานะล่าสุดเสมอ — ${scope}</p>
    ${noti?`<button class="btn block" id="askNoti" style="margin-bottom:12px">🔔 เปิดป้ายตัวเลขบนไอคอนแอป</button>
      <div class="note" style="margin-top:0">ต้องติดตั้งแอปลงหน้าจอโฮมก่อน (เมนู → Add to Home screen) แล้วกดปุ่มนี้อนุญาตแจ้งเตือน · ตัวเลขจะขึ้นที่ไอคอนเหมือนแอปทั่วไป</div>`:''}
    <div class="filterbar">
      <button class="fchip all" data-nf="all" aria-pressed="${f==='all'}" style="--c:var(--brand-soft);--ci:var(--brand-deep)">ทั้งหมด (${all.length})</button>
      <button class="fchip all" data-nf="pending" aria-pressed="${f==='pending'}" style="--c:var(--warn-soft);--ci:#8A6C1B">🕒 รออนุมัติ (${n('pending')})</button>
      <button class="fchip all" data-nf="approved" aria-pressed="${f==='approved'}" style="--c:var(--ok-soft);--ci:var(--ok)">✓ อนุมัติแล้ว (${n('approved')})</button>
      <button class="fchip all" data-nf="rejected" aria-pressed="${f==='rejected'}" style="--c:var(--bad-soft);--ci:var(--bad)">✕ ไม่อนุมัติ (${n('rejected')})</button>
      <button class="fchip all" data-nf="cancelled" aria-pressed="${f==='cancelled'}" style="--c:var(--bad-soft);--ci:var(--bad)">✕ คิวยกเลิก (${n('cancelled')})</button>
    </div>
    ${feed.length?`<div class="nfeed">${feed.map(notiCard).join('')}</div>`:
    '<div class="card"><div class="empty"><div class="big">✦</div>ไม่มีรายการในหมวดนี้</div></div>'}`);
  const an=$('askNoti');if(an)an.onclick=async()=>{
    try{
      const p=await Notification.requestPermission();
      toast(p==='granted'?'เปิดแล้ว — ตัวเลขจะขึ้นที่ไอคอนแอปตอนมีงานใหม่'
        :'ยังไม่ได้อนุญาต — เปิดได้ที่ตั้งค่าแจ้งเตือนของเครื่อง');
    }catch(e){toast('เครื่อง/เบราว์เซอร์นี้ยังไม่รองรับป้ายบนไอคอนแอป');}
    render();};
  view().querySelectorAll('[data-nf]').forEach(b=>b.onclick=()=>{state.feedFilter=b.dataset.nf;renderFeed();});
  view().querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>{
    const el=$('mail_'+b.dataset.mail);if(el){el.hidden=!el.hidden;b.textContent=el.hidden?'✉ ข้อความสำหรับอีเมล':'✉ ซ่อนข้อความ';}});
  bindCards(view());
}

      (สีจะรวมกันเป็นลายทางในปฏิทิน) คิวที่ลงจะไปตัดคิวว่างที่ Sales เห็นทันทีโดยอัตโนมัติ</li>
    <li>คิวว่างที่ Sales เห็นนับเฉพาะ 6 CTS: JUNE · POR · ATOM · SUI · POP · EYE — PAM, MILK (Senior Leader)
      และ BELLE (หัวหน้างาน) มีคิวแสดงในปฏิทิน แต่ไม่ถูกนับเป็นคิวว่าง</li>
    <li>ปฏิทินฝั่ง CTS ไม่แสดงว่าง/ไม่ว่าง แสดงเฉพาะงานจริง · กดวันเพื่อดูเป็นไทม์ไลน์ตามเวลา</li>
    <li>กดที่คิวในปฏิทินเพื่อดูรายละเอียดการเทรนทั้งหมดที่ดึงมาจากคำขออัตโนมัติ</li>
    <li>MAX-A / MAX-B ที่มีหลาย session ระบุ Product และหัวข้อแยกรายครั้งได้ · กลับมาแก้วันหรือเวลาของแต่ละ session ได้ภายหลัง</li>
    <li>มุมมองปฏิทิน: รายสัปดาห์ (เห็นทั้งทีมเรียงรายคน) และรายเดือน (ภาพรวมทั้งเดือน)</li>
    <li>สีของแต่ละคนคงที่ ใช้แยกว่าคิวไหนเป็นของใคร</li>
    <li>Sales: เขียวเข้ม = ว่างมาก · เขียวอ่อน = ว่างน้อย · เทา = เต็ม · ฟ้า = งานกลาง MA</li>
    <li>MAX ที่มีหลาย session ต้องเลือกวันให้ครบก่อนส่ง</li>
    <li>กรอกไม่ครบก็ส่งได้ ระบบจะสรุปที่ขาดและขอตอนอนุมัติ</li>
    <li>ส่งแล้วกัน slot ทันที · ไม่อนุมัติ = คืน slot อัตโนมัติ</li></ul></div>
  <button class="btn block" onclick="document.getElementById('scrim').click()">ปิด</button>`);
}

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(state.authed&&state.tab==='cal')renderCal();},220);});

/* ========================= BACKEND (Google Apps Script) =========================
   วาง Web app URL ที่ deploy แล้วลงใน API ด้านล่าง — ปล่อยว่าง = ทำงานแบบออฟไลน์ในเครื่อง
   ข้อมูลทั้งก้อนถูกเก็บเป็นไฟล์ JSON ไฟล์เดียวใน Drive (ดู Code.gs)
   ============================================================================== */
const API='https://script.google.com/macros/s/AKfycbx5WKYHiN66Z6ow4hgmb8j2pwf3bn_fUT-Pr7tj1xBQk78NIvm4MtKtgNowf9fy60fNUQ/exec';
/* เฉพาะ key เหล่านี้ที่บันทึก — ที่เหลือเป็นสถานะหน้าจอ (tab, filter, draft, login) ไม่ต้องเก็บ */
const SAVED=['sched','avail','skills','selfEvents','seSeq','requests','events','holidays','feed','seq','evSeq'];
const snap=()=>Object.fromEntries(SAVED.map(k=>[k,state[k]]));

/* รหัสผ่านไม่เคยอยู่ในไฟล์นี้ — เก็บไว้ในหน่วยความจำ (และ localStorage ของเครื่องผู้ใช้) แล้วส่งไปให้เซิร์ฟเวอร์ตรวจทุกครั้ง */
let auth={role:null,pw:null};
let version=0, lastSaved='', loaded=false, saving=false;

/* ยิงไปหลังบ้านครั้งเดียวจบ — ใส่ data มาด้วย = เขียน, ไม่ใส่ = อ่านอย่างเดียว */
const api=body=>fetch(API,{method:'POST',
  headers:{'Content-Type':'text/plain'},            // text/plain = ไม่เกิด CORS preflight กับ Apps Script
  body:JSON.stringify({...body,role:auth.role,pw:auth.pw})}).then(r=>r.json());

/* ===== รวมข้อมูลตอนสองคนแก้พร้อมกัน =====
   เดิม: ฝั่งที่บันทึกทีหลังโดนโยนข้อมูลเซิร์ฟเวอร์ทับ งานที่เพิ่งกรอกหายเงียบๆ
   ตอนนี้: เทียบ 3 ทาง (base = ของที่โหลดมาล่าสุด, mine = ของเรา, theirs = ของบนเซิร์ฟเวอร์)
   ใครแก้ตรงไหน ตรงนั้นชนะ · แก้จุดเดียวกันทั้งคู่ค่อยให้ฝั่งเซิร์ฟเวอร์ชนะ */
const sm=v=>JSON.stringify(v===undefined?null:v);
const eqv=(a,b)=>sm(a)===sm(b);
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
/* ตัวระบุแถวในลิสต์ — ไม่มี id ก็ merge ไม่ได้ */
const rowId=x=>isObj(x)?(x.id!=null?x.id:(isObj(x.r)&&x.r.id!=null?'f'+x.r.id:(x.date!=null?x.date:null))):null;
function merge3(base,mine,theirs){
  if(mine===undefined)return theirs;
  if(theirs===undefined)return mine;
  if(eqv(mine,theirs)||eqv(base,mine))return theirs;   // เราไม่ได้แก้ -> เอาของเขา
  if(eqv(base,theirs))return mine;                     // เขาไม่ได้แก้ -> เอาของเรา
  if(Array.isArray(mine)&&Array.isArray(theirs))return mergeList(Array.isArray(base)?base:[],mine,theirs);
  if(isObj(mine)&&isObj(theirs)){
    const out={},b=isObj(base)?base:{};
    new Set(Object.keys(mine).concat(Object.keys(theirs))).forEach(k=>{
      const v=merge3(b[k],mine[k],theirs[k]);
      if(v!==undefined)out[k]=v;});
    return out;
  }
  return theirs;   // ค่าเดี่ยวที่แก้ชนกันจริงๆ ให้ฝั่งเซิร์ฟเวอร์ชนะ
}
/* ตัวนับ id ต้องบวกรวมกัน ไม่ใช่เอาค่าใดค่าหนึ่ง — สองฝั่งเดินคนละที เลขจะได้ไม่ถอยหลัง
   (ตัว id เองกันชนด้วยตัวอักษรท้ายจาก newId อยู่แล้ว ตรงนี้แค่ทำให้เลขวิ่งไปข้างหน้า) */
function mergeState(base,mine,theirs){
  const out=merge3(base,mine,theirs);
  ['seq','evSeq','seSeq'].forEach(k=>{const b=base[k]||0;
    out[k]=Math.max(mine[k]||0,theirs[k]||0,(mine[k]||0)+(theirs[k]||0)-b);});
  return out;
}
function mergeList(base,mine,theirs){
  if(mine.concat(theirs).some(x=>rowId(x)==null))return mine;   // ไม่มีตัวระบุ = merge ไม่ได้ เก็บของเราไว้
  const map=l=>new Map(l.map(x=>[rowId(x),x]));
  const bm=map(base),tm=map(theirs),seen=new Set(),out=[];
  mine.forEach(x=>{const k=rowId(x);seen.add(k);
    if(bm.has(k)&&!tm.has(k)&&eqv(bm.get(k),x))return;          // เขาลบ เราไม่ได้แก้ -> ลบตาม
    out.push(tm.has(k)?merge3(bm.get(k),x,tm.get(k)):x);});
  theirs.forEach(x=>{const k=rowId(x);
    if(seen.has(k))return;
    if(bm.has(k)&&eqv(bm.get(k),x))return;                      // เราลบ เขาไม่ได้แก้ -> ลบตาม
    out.push(x);});
  return out;
}
/* feed เก็บ request มาด้วย — หลังโหลด/merge ต้องชี้กลับไปที่ตัวจริง ไม่งั้นการ์ดแจ้งเตือนจะค้างข้อมูลเก่า */
const relinkFeed=()=>state.feed.forEach(f=>{const m=state.requests.find(x=>x.id===f.r.id);if(m)f.r=m;});

/* เอาข้อมูลจากเซิร์ฟเวอร์มาใส่ state */
function apply(d){
  if(d.data&&Object.keys(d.data).length){
    Object.assign(state,d.data);
    relinkFeed();
  }
  sweepTBC();
  version=d.version||0;
  lastSaved=JSON.stringify(snap());
  loaded=true;
}

async function load(){
  if(!API)return;
  try{
    const d=await api({});
    if(!d.ok)return false;
    apply(d);
    return true;
  }catch(e){
    /* โหลดไม่สำเร็จ = ห้ามบันทึก ไม่งั้นจะเอา state เปล่าไปทับของจริงบนเซิร์ฟเวอร์ */
    toast('โหลดข้อมูลไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่');
    return false;
  }
}

/* ปุ่ม ⟳ — ดึงข้อมูลล่าสุดมาดูเดี๋ยวนี้ ไม่ต้องรอสลับแอปหรือรีโหลดหน้า */
async function refresh(){
  if(!API)return toast('โหมดออฟไลน์ — ไม่มีข้อมูลให้รีเฟรช');
  if(saving)return toast('กำลังบันทึกอยู่ — รอสักครู่แล้วกดใหม่');
  toast('กำลังโหลดข้อมูลล่าสุด…');
  if(await load()){render();toast('อัปเดตข้อมูลล่าสุดแล้ว');}
}

async function save(){
  if(!API||!loaded||saving)return;
  const body=JSON.stringify(snap());
  if(body===lastSaved)return;
  saving=true;
  try{
    const d=await api({version,data:JSON.parse(body)});
    if(!d.ok){toast('รหัสผ่านใช้ไม่ได้แล้ว — กรุณาเข้าสู่ระบบใหม่');loaded=false;return logout();}
    if(d.stale){
      /* มีคนบันทึกแทรกเข้ามา — รวมของเขากับของเราแทนการทับทิ้ง แล้วปล่อยให้รอบ retry ส่งผลรวมกลับขึ้นไป */
      const merged=mergeState(JSON.parse(lastSaved),JSON.parse(body),d.data);
      apply(d);                       // ตั้ง version + lastSaved เป็นของบนเซิร์ฟเวอร์
      Object.assign(state,merged);    // แล้วทับด้วยผลรวม -> snap() != lastSaved -> finally จะ save ต่อให้
      relinkFeed();
      render();toast('มีคนแก้พร้อมกัน — รวมข้อมูลของทั้งสองฝั่งแล้ว');
    }
    else{version=d.version;lastSaved=body;}
  }catch(e){
    toast('บันทึกไม่สำเร็จ — จะลองใหม่อัตโนมัติ');
  }finally{
    saving=false;
    if(loaded&&JSON.stringify(snap())!==lastSaved)setTimeout(save,1500);   // มีการแก้ระหว่างกำลังบันทึก หรือบันทึกพลาด → ลองใหม่
  }
}

/* สลับกลับมาที่แอป -> ดึงข้อมูลล่าสุด ตัวเลขบนไอคอนจะได้ตรงกับงานจริง
   (ไม่ดึงระหว่างกำลังบันทึก กันของที่แก้ค้างอยู่ถูกทับ) */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!state.authed||!loaded||saving)return;
  load().then(ok=>{if(ok)render();});
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});   // ไม่ทำงานตอนเปิดไฟล์ตรงๆ (file://) — ปกติ

restoreLogin();   // จำการล็อกอินครั้งก่อนไว้ ไม่ต้องกรอกรหัสใหม่ทุกครั้งที่เปิดแอป
</script>
